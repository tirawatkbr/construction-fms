<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construction Follow-up Management System</title>
<style>
  /* ============================================================
     EARLY GATING CSS — applies before anything else paints.
     The app shell is hidden by default. The boot script removes
     the gating class once auth completes (or once we know there is
     no auth, e.g. single-user mode).
     ============================================================ */
  .app-hidden-until-auth { display: none !important; }

  /* Initial loading screen — shown while we determine auth state. */
  .auth-loading {
    position: fixed;
    inset: 0;
    background: #F8FAFC;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 300;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #64748B;
  }
  .auth-loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #E2E8F0;
    border-top-color: #1E40AF;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ================================================================
     DESIGN SYSTEM — Construction FMS
     ================================================================
     1. Tokens (colors, type, space, radius, shadow, motion)
     2. Reset & base
     3. Typography utilities
     4. Layout (app shell, sidebar, topbar, content)
     5. Component primitives (button, badge, card, field, input, select)
     6. Domain components (stat-card, kpi, action-queue, table, calendar, timeline, modal/panel, toast)
     7. Responsive
     ================================================================ */

  /* ----------------------------------------------------------------
     1. DESIGN TOKENS
     ---------------------------------------------------------------- */
  :root {
    /* —— Color primitives (neutral) —— */
    --color-neutral-0:   #ffffff;
    --color-neutral-25:  #fcfcfd;
    --color-neutral-50:  #f9fafb;
    --color-neutral-100: #f3f4f6;
    --color-neutral-200: #e5e7eb;
    --color-neutral-300: #d1d5db;
    --color-neutral-400: #9ca3af;
    --color-neutral-500: #6b7280;
    --color-neutral-600: #4b5563;
    --color-neutral-700: #374151;
    --color-neutral-800: #1f2937;
    --color-neutral-900: #111827;

    /* —— Brand / primary (blue, calm-trustworthy) —— */
    --color-primary-50:  #eff6ff;
    --color-primary-100: #dbeafe;
    --color-primary-200: #bfdbfe;
    --color-primary-500: #3b82f6;
    --color-primary-600: #2563eb;
    --color-primary-700: #1d4ed8;
    --color-primary-800: #1e40af;
    --color-primary-900: #1e3a8a;

    /* —— Semantic palettes —— */
    --color-success-50:  #f0fdf4;
    --color-success-100: #dcfce7;
    --color-success-200: #bbf7d0;
    --color-success-500: #10b981;
    --color-success-600: #059669;
    --color-success-700: #047857;
    --color-success-800: #065f46;
    --color-success-900: #064e3b;

    --color-warning-50:  #fffbeb;
    --color-warning-100: #fef3c7;
    --color-warning-200: #fde68a;
    --color-warning-500: #f59e0b;
    --color-warning-600: #d97706;
    --color-warning-700: #b45309;
    --color-warning-800: #92400e;
    --color-warning-900: #78350f;

    --color-danger-50:  #fef2f2;
    --color-danger-100: #fee2e2;
    --color-danger-200: #fecaca;
    --color-danger-500: #ef4444;
    --color-danger-600: #dc2626;
    --color-danger-700: #b91c1c;
    --color-danger-800: #991b1b;
    --color-danger-900: #7f1d1d;

    --color-info-50:  #eff6ff;
    --color-info-100: #dbeafe;
    --color-info-600: #2563eb;
    --color-info-800: #1e40af;

    /* —— Semantic aliases (USE THESE in components) —— */
    --bg-app:           var(--color-neutral-100);
    --bg-surface:       var(--color-neutral-0);
    --bg-surface-alt:   var(--color-neutral-50);
    --bg-hover:         var(--color-neutral-50);
    --bg-selected:      var(--color-primary-50);

    --text-primary:     var(--color-neutral-900);
    --text-secondary:   var(--color-neutral-700);
    --text-tertiary:    var(--color-neutral-500);
    --text-muted:       var(--color-neutral-400);
    --text-inverse:     var(--color-neutral-0);
    --text-link:        var(--color-primary-600);
    --text-danger:      var(--color-danger-700);
    --text-success:     var(--color-success-700);
    --text-warning:     var(--color-warning-800);

    --border-subtle:    var(--color-neutral-100);
    --border-default:   var(--color-neutral-200);
    --border-strong:    var(--color-neutral-300);
    --border-focus:     var(--color-primary-600);

    --sidebar-bg:       var(--color-neutral-800);
    --sidebar-text:     var(--color-neutral-200);
    --sidebar-text-muted: var(--color-neutral-400);
    --sidebar-hover:    var(--color-neutral-700);
    --sidebar-active:   var(--color-primary-600);

    /* —— Typography —— */
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter",
                 "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", monospace;

    /* Type scale (rem-based for accessibility) */
    --text-2xs:   10.5px;
    --text-xs:    11px;
    --text-sm:    12px;
    --text-base:  13px;
    --text-md:    14px;
    --text-lg:    16px;
    --text-xl:    19px;
    --display-sm: 22px;
    --display-md: 28px;
    --display-lg: 34px;

    --line-tight:  1.2;
    --line-snug:   1.35;
    --line-normal: 1.5;
    --line-loose:  1.65;

    --weight-regular:  400;
    --weight-medium:   500;
    --weight-semibold: 600;
    --weight-bold:     700;
    --weight-black:    800;

    --tracking-tight:  -0.5px;
    --tracking-normal: 0;
    --tracking-wide:   0.3px;
    --tracking-wider:  0.5px;
    --tracking-widest: 0.8px;

    /* —— Spacing scale (4px base) —— */
    --space-0:   0;
    --space-1:   4px;
    --space-2:   8px;
    --space-3:   12px;
    --space-4:   16px;
    --space-5:   20px;
    --space-6:   24px;
    --space-8:   32px;
    --space-10:  40px;
    --space-12:  48px;
    --space-16:  64px;

    /* —— Radius —— */
    --radius-xs:   3px;
    --radius-sm:   4px;
    --radius-md:   6px;
    --radius-lg:   8px;
    --radius-xl:   10px;
    --radius-2xl:  12px;
    --radius-pill: 999px;

    /* —— Shadow —— */
    --shadow-xs:  0 1px 2px rgba(17, 24, 39, 0.05);
    --shadow-sm:  0 1px 3px rgba(17, 24, 39, 0.08), 0 1px 2px rgba(17, 24, 39, 0.04);
    --shadow-md:  0 4px 8px rgba(17, 24, 39, 0.06), 0 2px 4px rgba(17, 24, 39, 0.04);
    --shadow-lg:  0 10px 20px rgba(17, 24, 39, 0.08), 0 4px 8px rgba(17, 24, 39, 0.05);
    --shadow-xl:  0 20px 40px rgba(17, 24, 39, 0.12), 0 8px 16px rgba(17, 24, 39, 0.06);
    --shadow-focus: 0 0 0 3px rgba(37, 99, 235, 0.15);
    --shadow-focus-danger: 0 0 0 3px rgba(220, 38, 38, 0.15);
    --shadow-panel: -10px 0 30px rgba(17, 24, 39, 0.15);

    /* —— Motion —— */
    --motion-fast:   0.12s;
    --motion-base:   0.18s;
    --motion-slow:   0.24s;
    --ease-out:      cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out:   cubic-bezier(0.4, 0, 0.2, 1);

    /* —— Layout —— */
    --sidebar-width: 232px;
    --topbar-height: 60px;
    --content-padding: var(--space-6);
    --z-sidebar: 40;
    --z-topbar: 50;
    --z-backdrop: 80;
    --z-sidebar-mobile: 90;
    --z-modal: 100;
    --z-toast: 200;
  }

  /* ----------------------------------------------------------------
     2. RESET & BASE
     ---------------------------------------------------------------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    font-size: var(--text-md);
    color: var(--text-primary);
    background: var(--bg-app);
    line-height: var(--line-normal);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: var(--text-md); }
  table { border-collapse: collapse; }
  h1, h2, h3, h4, h5, h6 { margin: 0; font-weight: var(--weight-semibold); color: var(--text-primary); }
  p { margin: 0; }
  a { color: var(--text-link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Focus ring — accessibility */
  :focus-visible {
    outline: 2px solid var(--border-focus);
    outline-offset: 2px;
  }

  /* ----------------------------------------------------------------
     3. TYPOGRAPHY UTILITIES
     ---------------------------------------------------------------- */
  .text-2xs   { font-size: var(--text-2xs); }
  .text-xs    { font-size: var(--text-xs); }
  .text-sm    { font-size: var(--text-sm); }
  .text-base  { font-size: var(--text-base); }
  .text-md    { font-size: var(--text-md); }
  .text-lg    { font-size: var(--text-lg); }

  .text-primary   { color: var(--text-primary); }
  .text-secondary { color: var(--text-secondary); }
  .text-muted     { color: var(--text-tertiary); }
  .text-danger    { color: var(--text-danger); }

  .eyebrow {
    font-size: var(--text-xs);
    font-weight: var(--weight-bold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-widest);
    color: var(--text-tertiary);
  }

  /* ----------------------------------------------------------------
     4. LAYOUT
     ---------------------------------------------------------------- */
  .app { display: flex; min-height: 100vh; }

  /* —— Sidebar —— */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: var(--z-sidebar);
  }
  .sidebar-header {
    padding: var(--space-5) var(--space-5);
    border-bottom: 1px solid var(--color-neutral-700);
  }
  .sidebar-title {
    font-size: var(--text-md);
    font-weight: var(--weight-bold);
    letter-spacing: var(--tracking-wide);
    color: var(--color-neutral-0);
    margin: 0;
  }
  .sidebar-subtitle {
    font-size: var(--text-xs);
    color: var(--sidebar-text-muted);
    margin-top: var(--space-1);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
    font-weight: var(--weight-medium);
  }
  .nav {
    flex: 1;
    padding: var(--space-3) var(--space-2);
    overflow-y: auto;
  }
  .nav-item {
    display: flex;
    align-items: center;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--color-neutral-300);
    padding: var(--space-3) var(--space-3);
    border-radius: var(--radius-md);
    font-size: var(--text-md);
    margin-bottom: 2px;
    transition: background var(--motion-fast), color var(--motion-fast);
  }
  .nav-item:hover { background: var(--sidebar-hover); color: var(--color-neutral-0); }
  .nav-item.active {
    background: var(--sidebar-active);
    color: var(--color-neutral-0);
    font-weight: var(--weight-medium);
  }
  .nav-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    margin-right: var(--space-2);
    vertical-align: middle;
  }
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, 0.45);
    z-index: var(--z-backdrop);
  }
  .sidebar-backdrop.show { display: block; }

  /* —— Main area —— */
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
    padding: var(--space-4) var(--space-7, 28px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: var(--z-topbar);
    min-height: var(--topbar-height);
  }
  .topbar-title {
    font-size: var(--text-xl);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    margin: 0;
    letter-spacing: var(--tracking-tight);
  }
  .topbar-actions { display: flex; gap: var(--space-2); }
  .content {
    padding: var(--space-6) var(--space-7, 28px);
    flex: 1;
  }
  .mobile-menu-btn {
    display: none;
    background: transparent;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: var(--space-2) var(--space-3);
    font-size: var(--text-lg);
    color: var(--text-secondary);
  }

  /* ----------------------------------------------------------------
     5. COMPONENT PRIMITIVES
     ---------------------------------------------------------------- */

  /* —— Button —— */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    background: var(--bg-surface);
    color: var(--text-secondary);
    font-size: var(--text-base);
    font-weight: var(--weight-medium);
    line-height: 1.4;
    transition: all var(--motion-fast) var(--ease-in-out);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .btn:focus-visible { box-shadow: var(--shadow-focus); outline: none; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Variants */
  .btn-primary {
    background: var(--color-primary-600);
    color: var(--text-inverse);
    border-color: var(--color-primary-600);
  }
  .btn-primary:hover { background: var(--color-primary-700); border-color: var(--color-primary-700); }

  .btn-secondary {
    background: var(--bg-surface);
    color: var(--text-secondary);
    border-color: var(--border-strong);
  }
  .btn-secondary:hover { background: var(--bg-hover); }

  .btn-danger {
    background: var(--color-danger-600);
    color: var(--text-inverse);
    border-color: var(--color-danger-600);
  }
  .btn-danger:hover { background: var(--color-danger-700); border-color: var(--color-danger-700); }
  .btn-danger:focus-visible { box-shadow: var(--shadow-focus-danger); }

  .btn-success {
    background: var(--color-success-600);
    color: var(--text-inverse);
    border-color: var(--color-success-600);
  }
  .btn-success:hover { background: var(--color-success-700); border-color: var(--color-success-700); }

  /* Sizes */
  .btn-sm   { padding: var(--space-1) var(--space-3); font-size: var(--text-sm); }
  .btn-icon { padding: var(--space-2); }

  /* ============================================================
     ICON SYSTEM (inline SVG, no CDN dependency)
     Sizing scale: 12 / 14 / 16 / 18 / 20 / 32 px
     Stroke: 2px default (set on the <svg> element).
     Color: inherits via currentColor.
     ============================================================ */
  [data-lucide] {
    display: inline-block;
    line-height: 1;
  }
  svg.icon-xs, svg.icon-sm, svg.icon-md, svg.icon-lg, svg.icon-xl, svg.icon-2xl, svg.icon-3xl,
  i.icon-xs, i.icon-sm, i.icon-md, i.icon-lg, i.icon-xl, i.icon-2xl, i.icon-3xl {
    flex-shrink: 0;
    color: currentColor;
    vertical-align: middle;
  }
  .icon-xs   { width: 12px; height: 12px; }   /* Status badges, inline w/ small text */
  .icon-sm   { width: 14px; height: 14px; }   /* Meta chips, inline labels */
  .icon-md   { width: 16px; height: 16px; }   /* Sidebar nav, primary buttons */
  .icon-lg   { width: 18px; height: 18px; }   /* Toolbar buttons, card headers */
  .icon-xl   { width: 20px; height: 20px; }   /* KPI cards, calendar controls */
  .icon-2xl  { width: 32px; height: 32px; }   /* Empty states, hero */
  .icon-3xl  { width: 40px; height: 40px; }

  /* Ghost icon button — used for settings row Edit/Delete and similar inline actions */
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text-tertiary);
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    cursor: pointer;
    line-height: 1;
    padding: 0;
    transition: background var(--motion-fast), color var(--motion-fast);
  }
  .icon-btn:hover { background: var(--color-neutral-100); color: var(--text-primary); }
  .icon-btn:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }
  .icon-btn.icon-btn-danger:hover { color: var(--color-danger-600); background: var(--color-danger-50); }

  /* —— Badge —— */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    white-space: nowrap;
    letter-spacing: 0.1px;
  }
  .badge-completed   { background: var(--color-success-100); color: var(--color-success-800); }
  .badge-overdue     { background: var(--color-danger-100);  color: var(--color-danger-800); }
  .badge-duesoon     { background: var(--color-warning-100); color: var(--color-warning-800); }
  .badge-inprogress  { background: var(--color-info-100);    color: var(--color-info-800); }
  .badge-pending     { background: var(--color-warning-100); color: var(--color-warning-800); }
  .badge-onhold      { background: var(--color-neutral-200); color: var(--color-neutral-700); }
  .badge-notstarted  { background: var(--color-neutral-100); color: var(--color-neutral-600); }
  .badge-cancelled   { background: var(--color-neutral-200); color: var(--color-neutral-500); }
  .badge-default     { background: var(--color-neutral-200); color: var(--color-neutral-700); }

  /* —— Card —— */
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    padding: var(--space-5);
    margin-bottom: var(--space-4);
  }
  .card-title {
    font-size: var(--text-md);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    margin: 0 0 var(--space-4) 0;
    padding-bottom: var(--space-3);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }

  /* —— Form (classic, used in filters and meeting/settings forms) —— */
  .form-input, .form-select, .form-textarea {
    padding: 7px var(--space-3);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--bg-surface);
    color: var(--text-primary);
    font-size: var(--text-base);
    width: 100%;
    transition: border-color var(--motion-fast), box-shadow var(--motion-fast);
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: var(--shadow-focus);
  }
  .form-textarea { resize: vertical; min-height: 60px; line-height: var(--line-normal); }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-4);
  }
  .form-field { display: flex; flex-direction: column; gap: var(--space-1); }
  .form-field.full { grid-column: 1 / -1; }
  .form-label {
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--text-secondary);
  }
  .form-label .required { color: var(--text-danger); }

  /* ----------------------------------------------------------------
     6. DOMAIN COMPONENTS
     ---------------------------------------------------------------- */

  /* —— Filter bar (legacy, deprecated — keep for fallback only) —— */
  .filters {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    margin-bottom: var(--space-4);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: var(--space-3);
  }
  .filter-group { display: flex; flex-direction: column; gap: var(--space-1); }
  .filter-label {
    font-size: var(--text-xs);
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    font-weight: var(--weight-medium);
  }

  /* ============================================================
     FILTER TOOLBAR (search + Filter button + Sort button + chips)
     ============================================================ */
  .toolbar {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    padding: var(--space-3) var(--space-4);
    margin-bottom: var(--space-4);
    display: flex;
    align-items: center;
    gap: var(--space-2);
    flex-wrap: wrap;
  }
  .toolbar-search {
    position: relative;
    min-width: 200px;
    flex: 0 1 320px;
  }
  .toolbar-search-input {
    width: 100%;
    padding: 8px 12px 8px 36px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    background: var(--bg-surface);
    color: var(--text-primary);
    font-size: var(--text-base);
    transition: border-color var(--motion-fast), box-shadow var(--motion-fast);
  }
  .toolbar-search-input:focus {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: var(--shadow-focus);
  }
  .toolbar-search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    display: inline-flex;
    align-items: center;
  }

  .toolbar-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: 8px 14px;
    background: var(--bg-surface);
    color: var(--text-secondary);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    font-size: var(--text-base);
    font-weight: var(--weight-medium);
    cursor: pointer;
    transition: all var(--motion-fast);
    position: relative;
  }
  .toolbar-btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
  .toolbar-btn.active {
    border-color: var(--color-primary-600);
    color: var(--color-primary-700);
    background: var(--color-primary-50);
  }
  .toolbar-btn-icon { font-size: var(--text-md); line-height: 1; }
  .toolbar-btn-count {
    background: var(--color-primary-600);
    color: var(--text-inverse);
    border-radius: var(--radius-pill);
    padding: 1px 7px;
    font-size: var(--text-xs);
    font-weight: var(--weight-bold);
    min-width: 18px;
    text-align: center;
  }
  .toolbar-btn-caret {
    color: var(--text-muted);
    margin-left: 2px;
  }
  .toolbar-btn-icon { display: inline-flex; align-items: center; line-height: 1; }

  /* Active filter chips */
  .toolbar-chips {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1);
    align-items: center;
    flex: 1;
    min-width: 0;
  }
  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 4px 4px 10px;
    background: var(--color-primary-50);
    color: var(--color-primary-800);
    border: 1px solid var(--color-primary-200);
    border-radius: var(--radius-pill);
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    white-space: nowrap;
  }
  .filter-chip-key {
    font-weight: var(--weight-semibold);
    opacity: 0.7;
    text-transform: uppercase;
    font-size: var(--text-2xs);
    letter-spacing: var(--tracking-wide);
  }
  .filter-chip-remove {
    background: transparent;
    border: none;
    color: var(--color-primary-700);
    line-height: 1;
    padding: 4px;
    cursor: pointer;
    border-radius: var(--radius-pill);
    transition: background var(--motion-fast);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .filter-chip-remove:hover { background: var(--color-primary-100); }
  .toolbar-clear-all {
    background: transparent;
    border: none;
    color: var(--text-tertiary);
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-decoration: underline;
  }
  .toolbar-clear-all:hover { color: var(--text-danger); }

  /* ============================================================
     POPOVER (filter / sort)
     ============================================================ */
  .popover-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 90;
  }
  .popover-backdrop.show { display: block; }

  .popover {
    position: absolute;
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xl);
    z-index: 91;
    animation: popoverIn var(--motion-fast) var(--ease-out);
  }
  @keyframes popoverIn {
    from { opacity: 0; transform: translateY(-4px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Filter popover */
  .popover-filter {
    width: min(640px, calc(100vw - 32px));
    max-height: 75vh;
    display: flex;
    flex-direction: column;
  }
  .popover-header {
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border-default);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .popover-title {
    font-size: var(--text-md);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    margin: 0;
    display: inline-flex;
    align-items: baseline;
    gap: var(--space-2);
  }
  .popover-hint {
    font-size: var(--text-xs);
    font-weight: var(--weight-regular);
    color: var(--text-tertiary);
    text-transform: none;
    letter-spacing: 0;
  }
  .popover-close {
    background: transparent;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    padding: 4px;
    border-radius: var(--radius-sm);
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .popover-close:hover { background: var(--bg-hover); color: var(--text-primary); }
  .popover-body {
    padding: var(--space-4);
    overflow-y: auto;
    flex: 1;
  }
  .popover-footer {
    padding: var(--space-3) var(--space-4);
    border-top: 1px solid var(--border-default);
    background: var(--bg-surface-alt);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-2);
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  }

  .filter-section { margin-bottom: var(--space-4); }
  .filter-section:last-child { margin-bottom: 0; }
  .filter-section-title {
    font-size: var(--text-sm);
    font-weight: var(--weight-bold);
    color: var(--text-primary);
    margin: 0 0 var(--space-2) 0;
    padding-bottom: var(--space-2);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }
  .chip-option {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px 5px 8px;
    background: var(--bg-surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-pill);
    font-size: var(--text-sm);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--motion-fast);
    user-select: none;
  }
  .chip-option:hover { border-color: var(--color-primary-500); color: var(--text-primary); }
  .chip-option.selected {
    background: var(--color-primary-600);
    color: var(--text-inverse);
    border-color: var(--color-primary-600);
  }
  .chip-option-radio {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    background: var(--bg-surface);
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all var(--motion-fast);
  }
  .chip-option.selected .chip-option-radio {
    background: var(--bg-surface);
    border-color: var(--bg-surface);
  }
  .chip-option.selected .chip-option-radio::after {
    content: '✓';
    color: var(--color-primary-700);
    font-size: 10px;
    font-weight: var(--weight-bold);
  }
  .filter-date-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
  }
  .filter-date-input {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--bg-surface);
    color: var(--text-primary);
    font-size: var(--text-base);
  }
  .filter-date-input:focus {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: var(--shadow-focus);
  }
  .filter-date-label {
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    color: var(--text-tertiary);
    font-weight: var(--weight-medium);
    margin-bottom: 4px;
    display: block;
  }

  /* Sort popover */
  .popover-sort {
    width: 240px;
    padding: var(--space-2);
  }
  .sort-section-title {
    font-size: var(--text-xs);
    font-weight: var(--weight-bold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    color: var(--text-tertiary);
    padding: var(--space-2) var(--space-3) var(--space-1);
  }
  .sort-option {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: var(--text-base);
    color: var(--text-secondary);
    transition: background var(--motion-fast);
  }
  .sort-option:hover { background: var(--bg-hover); }
  .sort-option-radio {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    flex-shrink: 0;
    position: relative;
    transition: border-color var(--motion-fast);
  }
  .sort-option.selected .sort-option-radio {
    border-color: var(--color-primary-600);
  }
  .sort-option.selected .sort-option-radio::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--color-primary-600);
  }
  .sort-option.selected {
    color: var(--text-primary);
    font-weight: var(--weight-medium);
  }
  .sort-divider {
    height: 1px;
    background: var(--border-subtle);
    margin: var(--space-2) 0;
  }
  .sort-dir {
    display: flex;
    gap: var(--space-1);
    padding: 0 var(--space-1);
  }
  .sort-dir-option {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: var(--space-2);
    border: 1.5px solid var(--border-default);
    border-radius: var(--radius-sm);
    background: var(--bg-surface);
    color: var(--text-secondary);
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    cursor: pointer;
    transition: all var(--motion-fast);
  }
  .sort-dir-option:hover { border-color: var(--border-strong); }
  .sort-dir-option.selected {
    border-color: var(--color-primary-600);
    color: var(--color-primary-700);
    background: var(--color-primary-50);
  }

  @media (max-width: 600px) {
    .toolbar { padding: var(--space-3); }
    .toolbar-search { flex: 1 1 100%; }
    .popover-filter { width: calc(100vw - 16px); }
    .filter-date-row { grid-template-columns: 1fr; }
  }

  /* —— Legacy stats grid (kept for fallback) —— */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: var(--space-4);
    margin-bottom: var(--space-5);
  }
  .stat-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
  }
  .stat-label {
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
    color: var(--text-tertiary);
    margin-bottom: var(--space-2);
    font-weight: var(--weight-medium);
  }
  .stat-value {
    font-size: var(--display-sm);
    font-weight: var(--weight-bold);
    color: var(--text-primary);
  }

  /* ================================================================
     DASHBOARD — Simplified 2-tier hierarchy for 5-second scan
     ================================================================
     TIER 1: One status bar  (state at a glance)
     TIER 2: Two-column grid (Action Queue | Side panel with stats + breakdowns + mini-cal)
     TIER 3: Optional supporting section (calendar, full timeline) below
     ================================================================ */

  /* —— TIER 1: Status bar (replaces hero + KPI grid) —— */
  .status-bar {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-left: 6px solid var(--color-neutral-300);
    border-radius: var(--radius-xl);
    padding: var(--space-5) var(--space-6);
    margin-bottom: var(--space-5);
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: var(--space-6);
    align-items: center;
  }
  .status-bar.alert  { border-left-color: var(--color-danger-600);  background: linear-gradient(90deg, var(--color-danger-50) 0%, var(--bg-surface) 60%); }
  .status-bar.warn   { border-left-color: var(--color-warning-500); background: linear-gradient(90deg, var(--color-warning-50) 0%, var(--bg-surface) 60%); }
  .status-bar.clear  { border-left-color: var(--color-success-500); background: linear-gradient(90deg, var(--color-success-50) 0%, var(--bg-surface) 60%); }
  .status-bar.empty  { border-left-color: var(--color-neutral-300); }

  .status-bar-headline { min-width: 0; }
  .status-bar-eyebrow {
    font-size: var(--text-xs);
    font-weight: var(--weight-bold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-widest);
    color: var(--text-tertiary);
    margin-bottom: var(--space-1);
  }
  .status-bar.alert .status-bar-eyebrow { color: var(--color-danger-700); }
  .status-bar.warn  .status-bar-eyebrow { color: var(--color-warning-800); }
  .status-bar.clear .status-bar-eyebrow { color: var(--color-success-700); }

  .status-bar-title {
    font-size: var(--display-md);
    font-weight: var(--weight-black);
    color: var(--text-primary);
    line-height: var(--line-tight);
    letter-spacing: var(--tracking-tight);
    margin: 0;
  }
  .status-bar.alert .status-bar-title { color: var(--color-danger-900); }
  .status-bar.warn  .status-bar-title { color: var(--color-warning-900); }
  .status-bar.clear .status-bar-title { color: var(--color-success-900); }

  /* Inline stat strip on the right */
  .status-bar-stats {
    display: flex;
    gap: var(--space-6);
    align-items: center;
  }
  .status-stat { text-align: center; min-width: 64px; }
  .status-stat-value {
    font-size: var(--display-md);
    font-weight: var(--weight-black);
    color: var(--text-primary);
    line-height: 1;
    letter-spacing: var(--tracking-tight);
  }
  .status-stat-value.danger  { color: var(--color-danger-700); }
  .status-stat-value.warning { color: var(--color-warning-800); }
  .status-stat-value.success { color: var(--color-success-700); }
  .status-stat-label {
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    color: var(--text-tertiary);
    margin-top: var(--space-1);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    justify-content: center;
  }
  .status-stat-divider {
    width: 1px;
    height: 36px;
    background: var(--border-default);
  }

  /* —— TIER 2: Two-column dashboard grid —— */
  .dashboard-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
    gap: var(--space-5);
    margin-bottom: var(--space-5);
  }
  @media (max-width: 1100px) {
    .dashboard-grid { grid-template-columns: 1fr; }
  }

  /* —— Action Queue (primary focus, left column) —— */
  .action-queue-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-xl);
    padding: 0;
    overflow: hidden;
    margin-bottom: 0;
    height: fit-content;
  }
  .action-queue-header {
    padding: var(--space-4) var(--space-5);
    background: var(--bg-surface-alt);
    border-bottom: 1px solid var(--border-default);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-3);
  }
  .action-queue-title {
    font-size: var(--text-md);
    font-weight: var(--weight-bold);
    color: var(--text-primary);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .action-queue-count {
    background: var(--color-primary-600);
    color: var(--text-inverse);
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    font-size: var(--text-sm);
    font-weight: var(--weight-bold);
  }
  .action-queue-count.danger { background: var(--color-danger-600); }
  .action-queue-body {
    padding: var(--space-1) 0;
    max-height: 520px;
    overflow-y: auto;
  }
  .action-queue-item {
    padding: var(--space-3) var(--space-5);
    border-bottom: 1px solid var(--border-subtle);
    display: grid;
    grid-template-columns: 68px 1fr auto;
    gap: var(--space-4);
    align-items: center;
    cursor: pointer;
    transition: background var(--motion-fast);
  }
  .action-queue-item:hover { background: var(--bg-selected); }
  .action-queue-item:last-child { border-bottom: none; }
  .action-queue-when {
    text-align: center;
    padding: var(--space-2) var(--space-1);
    border-radius: var(--radius-md);
    background: var(--color-neutral-100);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    color: var(--text-secondary);
    line-height: var(--line-snug);
  }
  .action-queue-when.overdue { background: var(--color-danger-100);  color: var(--color-danger-800); }
  .action-queue-when.today   { background: var(--color-primary-100); color: var(--color-primary-800); }
  .action-queue-when.soon    { background: var(--color-warning-100); color: var(--color-warning-800); }
  .action-queue-when-days {
    display: block;
    font-size: var(--text-lg);
    font-weight: var(--weight-black);
    line-height: 1;
    margin-bottom: 2px;
  }
  .action-queue-content { min-width: 0; }
  .action-queue-itemtitle {
    font-size: var(--text-md);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .action-queue-meta {
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .action-queue-empty {
    padding: var(--space-10) var(--space-5);
    text-align: center;
    color: var(--text-muted);
    font-size: var(--text-base);
  }
  .action-queue-empty-icon {
    font-size: 40px;
    margin-bottom: var(--space-2);
    opacity: 0.4;
  }

  /* —— Side panel (right column) —— */
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }
  .side-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-xl);
    overflow: hidden;
  }
  .side-card-header {
    padding: var(--space-3) var(--space-4);
    background: var(--bg-surface-alt);
    border-bottom: 1px solid var(--border-default);
    font-size: var(--text-xs);
    font-weight: var(--weight-bold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .side-card-body { padding: var(--space-3) var(--space-4); }

  /* Mini progress bar inside side cards */
  .progress-block { margin-bottom: var(--space-3); }
  .progress-block:last-child { margin-bottom: 0; }
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: var(--space-1);
  }
  .progress-label {
    font-size: var(--text-sm);
    color: var(--text-secondary);
    font-weight: var(--weight-medium);
  }
  .progress-value {
    font-size: var(--text-sm);
    color: var(--text-primary);
    font-weight: var(--weight-semibold);
  }
  .progress-bar {
    height: 6px;
    background: var(--color-neutral-100);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--color-primary-500);
    border-radius: var(--radius-pill);
    transition: width var(--motion-base);
  }
  .progress-fill.success { background: var(--color-success-500); }
  .progress-fill.warning { background: var(--color-warning-500); }
  .progress-fill.danger  { background: var(--color-danger-500); }

  /* Big completion ring (visual progress) */
  .completion-ring-wrap {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-2) 0;
  }
  .completion-ring {
    width: 80px;
    height: 80px;
    flex-shrink: 0;
  }
  .completion-ring-text {
    min-width: 0;
  }
  .completion-ring-percent {
    font-size: var(--display-md);
    font-weight: var(--weight-black);
    color: var(--text-primary);
    line-height: 1;
    letter-spacing: var(--tracking-tight);
  }
  .completion-ring-label {
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    margin-top: var(--space-1);
  }

  /* Compact breakdown list inside side cards */
  .compact-breakdown {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .compact-breakdown-item {
    display: grid;
    grid-template-columns: 1fr auto 32px;
    gap: var(--space-3);
    align-items: center;
    padding: var(--space-2) 0;
    border-bottom: 1px solid var(--border-subtle);
    font-size: var(--text-sm);
  }
  .compact-breakdown-item:last-child { border-bottom: none; }
  .compact-breakdown-name {
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .compact-breakdown-bar {
    width: 60px;
    height: 4px;
    background: var(--color-neutral-100);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .compact-breakdown-fill {
    height: 100%;
    background: var(--color-primary-500);
    border-radius: var(--radius-pill);
  }
  .compact-breakdown-count {
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    text-align: right;
  }

  /* —— Supporting (Tier 3, less prominent) —— */
  .supporting-section-title {
    font-size: var(--text-xs);
    font-weight: var(--weight-bold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-widest);
    color: var(--text-muted);
    margin: var(--space-6) 0 var(--space-3) 0;
    padding-left: var(--space-1);
  }

  /* Mobile: status bar stacks */
  @media (max-width: 760px) {
    .status-bar {
      grid-template-columns: 1fr;
      gap: var(--space-3);
      padding: var(--space-4);
    }
    .status-bar-stats {
      gap: var(--space-3);
      justify-content: space-between;
    }
    .status-stat-value { font-size: var(--display-sm); }
  }

  /* —— Breakdown lists —— */
  .breakdown-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: var(--space-4);
    margin-bottom: var(--space-5);
  }
  .breakdown-list { list-style: none; padding: 0; margin: 0; }
  .breakdown-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-2) 0;
    border-bottom: 1px solid var(--border-subtle);
    font-size: var(--text-base);
  }
  .breakdown-item:last-child { border-bottom: none; }
  .breakdown-name { color: var(--text-secondary); }
  .breakdown-count {
    background: var(--color-neutral-100);
    color: var(--text-primary);
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    font-weight: var(--weight-semibold);
    font-size: var(--text-sm);
  }

  /* —— Tables —— */
  .table-wrap {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    overflow-x: auto;
  }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--text-base);
  }
  .data-table th {
    background: var(--bg-surface-alt);
    color: var(--text-secondary);
    font-weight: var(--weight-semibold);
    text-align: left;
    padding: var(--space-3) var(--space-3);
    border-bottom: 1px solid var(--border-default);
    white-space: nowrap;
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
  }
  .data-table th.sortable { cursor: pointer; user-select: none; }
  .data-table th.sortable:hover { background: var(--color-neutral-100); color: var(--text-primary); }
  .data-table td {
    padding: var(--space-3) var(--space-3);
    border-bottom: 1px solid var(--border-subtle);
    vertical-align: middle;
    color: var(--text-primary);
  }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover { background: var(--bg-hover); }
  .data-table tr.row-overdue { background: var(--color-danger-50); }
  .data-table tr.row-overdue:hover { background: var(--color-danger-100); }
  .data-table tr.row-completed td { color: var(--text-tertiary); }
  .data-table tr.clickable-row { cursor: pointer; }
  .data-table tr.clickable-row:hover { background: var(--bg-selected); }
  .data-table tr.clickable-row.row-overdue:hover { background: var(--color-danger-100); }

  /* ============================================================
     SCANNABLE LIST CARD (Follow-up List — hierarchy redesign)
     ============================================================ */
  .item-list {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .item-list-header {
    display: grid;
    grid-template-columns: 4px 96px 1fr 110px 130px;
    gap: var(--space-4);
    padding: var(--space-3) var(--space-5);
    background: var(--bg-surface-alt);
    border-bottom: 1px solid var(--border-default);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    color: var(--text-tertiary);
  }
  .item-list-header > *:first-child { /* spacer for the left urgency border */ }
  .item-list-header .sortable { cursor: pointer; user-select: none; }
  .item-list-header .sortable:hover { color: var(--text-primary); }

  .item-row {
    display: grid;
    grid-template-columns: 4px 96px 1fr 110px 130px;
    gap: var(--space-4);
    padding: var(--space-4) var(--space-5);
    border-bottom: 1px solid var(--border-subtle);
    cursor: pointer;
    transition: background var(--motion-fast);
    align-items: center;
  }
  .item-row:hover { background: var(--bg-selected); }
  .item-row:last-child { border-bottom: none; }

  /* Left urgency bar */
  .item-urgency {
    width: 4px;
    height: 100%;
    min-height: 48px;
    border-radius: var(--radius-xs);
    background: transparent;
    align-self: stretch;
  }
  .item-row.is-overdue .item-urgency { background: var(--color-danger-600); }
  .item-row.is-duesoon .item-urgency { background: var(--color-warning-500); }
  .item-row.is-completed .item-urgency { background: var(--color-success-500); }

  /* Due date pill (left column, prominent urgency signal) */
  .due-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: var(--space-2) var(--space-1);
    border-radius: var(--radius-md);
    background: var(--color-neutral-100);
    color: var(--text-secondary);
    min-height: 56px;
  }
  .due-pill.overdue { background: var(--color-danger-100); color: var(--color-danger-800); }
  .due-pill.today   { background: var(--color-primary-100); color: var(--color-primary-800); }
  .due-pill.soon    { background: var(--color-warning-100); color: var(--color-warning-800); }
  .due-pill.future  { background: var(--color-neutral-50); color: var(--text-secondary); }
  .due-pill.none    { background: transparent; color: var(--text-muted); }
  .due-pill-big {
    font-size: var(--text-xl);
    font-weight: var(--weight-black);
    line-height: 1;
    letter-spacing: var(--tracking-tight);
  }
  .due-pill-label {
    font-size: var(--text-2xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    margin-top: 2px;
    opacity: 0.85;
  }
  .due-pill-date {
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
  }

  /* Middle content column */
  .item-content { min-width: 0; }
  .item-title {
    font-size: var(--text-md);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    line-height: var(--line-snug);
    margin: 0 0 var(--space-1) 0;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }
  .item-row.is-completed .item-title {
    color: var(--text-tertiary);
    text-decoration: line-through;
  }
  .item-meta {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1) var(--space-3);
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    margin-bottom: var(--space-1);
    line-height: var(--line-snug);
  }
  .item-meta-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .item-meta-chip-icon {
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
  }
  .item-update {
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    font-style: italic;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .item-update-label {
    font-style: normal;
    font-weight: var(--weight-semibold);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    font-size: var(--text-2xs);
    margin-right: var(--space-1);
  }

  /* Follow-up date (smaller, secondary) */
  .item-followup {
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    text-align: left;
  }
  .item-followup-label {
    font-size: var(--text-2xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .item-followup-date {
    font-size: var(--text-sm);
    color: var(--text-secondary);
    font-weight: var(--weight-medium);
  }
  .item-followup-empty { color: var(--text-muted); font-style: italic; }

  /* Status column right */
  .item-status { display: flex; justify-content: flex-end; align-items: center; }

  /* Responsive */
  @media (max-width: 900px) {
    .item-list-header { display: none; }
    .item-row {
      grid-template-columns: 4px 80px 1fr;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
    }
    .item-followup, .item-status {
      grid-column: 2 / -1;
      justify-content: flex-start;
      margin-top: var(--space-1);
    }
    .item-followup { display: none; }
    .item-status { display: flex; }
  }
  @media (max-width: 480px) {
    .item-row { grid-template-columns: 4px 68px 1fr; }
    .due-pill { min-height: 48px; padding: var(--space-1); }
    .due-pill-big { font-size: var(--text-lg); }
  }

  /* ============================================================
     MEETING LIST CARD (hierarchy redesign)
     ============================================================ */
  .meeting-list {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .meeting-list-header {
    display: grid;
    grid-template-columns: 4px 80px 1fr 140px 120px;
    gap: var(--space-4);
    padding: var(--space-3) var(--space-5);
    background: var(--bg-surface-alt);
    border-bottom: 1px solid var(--border-default);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    color: var(--text-tertiary);
  }
  .meeting-row {
    display: grid;
    grid-template-columns: 4px 80px 1fr 140px 120px;
    gap: var(--space-4);
    padding: var(--space-4) var(--space-5);
    border-bottom: 1px solid var(--border-subtle);
    cursor: pointer;
    transition: background var(--motion-fast);
    align-items: center;
  }
  .meeting-row:hover { background: var(--bg-selected); }
  .meeting-row:last-child { border-bottom: none; }

  /* Left accent (only colored if follow-up is upcoming) */
  .meeting-accent {
    width: 4px;
    height: 100%;
    min-height: 56px;
    border-radius: var(--radius-xs);
    background: transparent;
    align-self: stretch;
  }
  .meeting-row.has-upcoming .meeting-accent { background: var(--color-primary-500); }
  .meeting-row.has-overdue-followup .meeting-accent { background: var(--color-warning-500); }

  /* Date tear-off (calendar style) */
  .meeting-date-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--space-2) var(--space-1);
    border-radius: var(--radius-md);
    background: var(--color-neutral-50);
    border: 1px solid var(--border-default);
    min-height: 64px;
  }
  .meeting-date-day {
    font-size: var(--display-sm);
    font-weight: var(--weight-black);
    line-height: 1;
    color: var(--text-primary);
    letter-spacing: var(--tracking-tight);
  }
  .meeting-date-month {
    font-size: var(--text-2xs);
    font-weight: var(--weight-bold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-widest);
    color: var(--text-tertiary);
    margin-top: 3px;
  }
  .meeting-date-year {
    font-size: var(--text-2xs);
    color: var(--text-muted);
    margin-top: 1px;
  }

  /* Middle content */
  .meeting-content { min-width: 0; }
  .meeting-decision {
    font-size: var(--text-md);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    line-height: var(--line-snug);
    margin: 0 0 var(--space-1) 0;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }
  .meeting-decision-empty {
    color: var(--text-muted);
    font-weight: var(--weight-regular);
    font-style: italic;
  }
  .meeting-decision-label {
    display: inline-block;
    font-size: var(--text-2xs);
    font-weight: var(--weight-bold);
    color: var(--text-success);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    margin-right: var(--space-2);
    vertical-align: middle;
    background: var(--color-success-100);
    padding: 2px 6px;
    border-radius: var(--radius-xs);
  }
  .meeting-discussion {
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    line-height: var(--line-snug);
    margin-bottom: var(--space-1);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
  }
  .meeting-discussion-label {
    font-weight: var(--weight-semibold);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    font-size: var(--text-2xs);
    margin-right: var(--space-1);
  }
  .meeting-attendees {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    margin-top: 3px;
  }
  .meeting-attendees-icon {
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
  }
  .meeting-attendees-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Action owner column */
  .meeting-owner {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .meeting-owner-label {
    font-size: var(--text-2xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    color: var(--text-muted);
  }
  .meeting-owner-name {
    font-size: var(--text-sm);
    color: var(--text-primary);
    font-weight: var(--weight-medium);
    line-height: var(--line-snug);
  }
  .meeting-owner-empty { color: var(--text-muted); font-style: italic; font-weight: var(--weight-regular); }

  /* Follow-up column */
  .meeting-followup {
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: flex-start;
  }
  .meeting-followup-pill {
    display: inline-block;
    padding: 3px 8px;
    border-radius: var(--radius-pill);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    background: var(--color-neutral-100);
    color: var(--text-secondary);
  }
  .meeting-followup-pill.upcoming { background: var(--color-primary-100); color: var(--color-primary-800); }
  .meeting-followup-pill.past     { background: var(--color-neutral-100); color: var(--text-muted); }
  .meeting-followup-pill.today    { background: var(--color-warning-100); color: var(--color-warning-800); }
  .meeting-followup-label {
    font-size: var(--text-2xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    color: var(--text-muted);
  }
  .meeting-followup-empty {
    font-size: var(--text-sm);
    color: var(--text-muted);
    font-style: italic;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .meeting-list-header { display: none; }
    .meeting-row {
      grid-template-columns: 4px 72px 1fr;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
    }
    .meeting-owner, .meeting-followup {
      grid-column: 2 / -1;
      flex-direction: row;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-1);
    }
    .meeting-followup { display: none; }
  }
  @media (max-width: 480px) {
    .meeting-row { grid-template-columns: 4px 60px 1fr; }
    .meeting-date-pill { min-height: 56px; padding: var(--space-1); }
    .meeting-date-day { font-size: var(--text-xl); }
  }
  .row-actions { display: flex; gap: var(--space-1); }
  .empty-state {
    padding: var(--space-10);
    text-align: center;
    color: var(--text-muted);
    font-size: var(--text-md);
  }

  /* —— Calendar —— */
  .calendar {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    margin-bottom: var(--space-4);
  }
  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-3);
  }
  .calendar-title {
    font-size: var(--text-lg);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
  }
  .calendar-controls { display: flex; gap: var(--space-2); align-items: center; }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: var(--space-1);
  }
  .calendar-day-header {
    text-align: center;
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    color: var(--text-tertiary);
    text-transform: uppercase;
    padding: var(--space-2) 0;
    letter-spacing: var(--tracking-wider);
  }
  .calendar-day {
    min-height: 70px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: var(--space-1);
    background: var(--bg-surface);
    position: relative;
    cursor: pointer;
    transition: background var(--motion-fast);
    font-size: var(--text-sm);
  }
  .calendar-day:hover { background: var(--bg-surface-alt); }
  .calendar-day.empty { background: var(--bg-surface-alt); cursor: default; }
  .calendar-day.today { border-color: var(--color-primary-600); border-width: 2px; }
  .calendar-day-number {
    font-weight: var(--weight-semibold);
    color: var(--text-secondary);
    font-size: var(--text-sm);
  }
  .calendar-day.today .calendar-day-number { color: var(--color-primary-700); }
  .calendar-day-indicators {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    margin-top: 3px;
  }
  .cal-dot {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: 9px;
    padding: 1px 4px;
    border-radius: var(--radius-xs);
    font-weight: var(--weight-semibold);
  }
  .cal-dot-followup { background: var(--color-info-100);    color: var(--color-info-800); }
  .cal-dot-due      { background: var(--color-warning-100); color: var(--color-warning-800); }
  .cal-dot-overdue  { background: var(--color-danger-100);  color: var(--color-danger-800); }

  .calendar-legend {
    display: flex;
    gap: var(--space-4);
    margin-top: var(--space-3);
    flex-wrap: wrap;
    font-size: var(--text-xs);
    color: var(--text-tertiary);
  }
  .legend-item { display: flex; align-items: center; gap: var(--space-1); }
  .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: var(--radius-xs);
  }

  /* —— Timeline —— */
  .timeline-list { list-style: none; padding: 0; margin: 0; }
  .timeline-item {
    padding: var(--space-3) var(--space-3);
    border-left: 3px solid var(--border-strong);
    margin-bottom: var(--space-2);
    background: var(--bg-surface-alt);
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    display: grid;
    grid-template-columns: 90px 90px 1fr auto;
    gap: var(--space-3);
    align-items: center;
    font-size: var(--text-base);
  }
  .timeline-item.overdue {
    border-left-color: var(--color-danger-600);
    background: var(--color-danger-50);
  }
  .timeline-item.duesoon {
    border-left-color: var(--color-warning-600);
    background: var(--color-warning-50);
  }
  .timeline-item.completed {
    border-left-color: var(--color-success-600);
    opacity: 0.65;
    text-decoration: line-through;
  }
  .timeline-date {
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    font-size: var(--text-sm);
  }
  .timeline-type {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    color: var(--text-tertiary);
    font-weight: var(--weight-semibold);
  }
  .timeline-content { color: var(--text-secondary); min-width: 0; }
  .timeline-title { font-weight: var(--weight-medium); color: var(--text-primary); }
  .timeline-meta { font-size: var(--text-xs); color: var(--text-tertiary); margin-top: 2px; }

  /* —— Settings —— */
  .settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: var(--space-4);
  }
  .settings-list {
    list-style: none;
    padding: 0;
    margin: 0 0 var(--space-3) 0;
    max-height: 240px;
    overflow-y: auto;
  }
  .settings-list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-2) var(--space-2);
    border-bottom: 1px solid var(--border-subtle);
    font-size: var(--text-base);
  }
  .settings-list-item:last-child { border-bottom: none; }
  .settings-add { display: flex; gap: var(--space-2); }
  .settings-add input { flex: 1; }

  /* —— Modal & Right slide-in panel —— */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, 0.55);
    z-index: var(--z-modal);
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: var(--space-8) var(--space-4);

/* =================================================================
   SUPABASE CONFIGURATION (multi-user mode)
   =================================================================
   To enable real-time, multi-user collaboration with Google login:
   1. Replace SUPABASE_URL and SUPABASE_KEY with your project values.
   2. Set up Google OAuth and tables per the setup guide.
   3. Save and reload — the login screen will appear on first visit.

   To stay in single-user (localStorage-only) mode:
   Leave both values as empty strings.

   Where to find these values:
   - Supabase dashboard → Project Settings → API
   - "Project URL" → paste below
   - "anon public" key → paste below
================================================================= */
const SUPABASE_URL = 'https://awfxdziicxrrkvmnjaax.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mMKlJHUKqFVU_VA2TgxWDg_9Ae5WeyL';

/* Computed flag: are we in multi-user mode? Only true if BOTH:
   - The user has filled in URL and KEY constants above
   - The Supabase CDN library has loaded successfully
   - The client initialized without error

const _SUPABASE_LIB_LOADED   = !!(typeof window !== 'undefined' && window.supabase && typeof window.supabase.createClient === 'function');

if (_CLOUD_CONFIG_PROVIDED && _SUPABASE_LIB_LOADED) {

    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {

        autoRefreshToken: true,

    console.error('[CFMS] Failed to initialize Supabase client. Falling back to single-user mode.', e);
    sb = null;

}

/* Convert camelCase object → snake_case row for the database. */
function toDbRow(obj, fieldMap) {
  const row = {};
  for (const [jsKey, dbKey] of Object.entries(fieldMap)) {
    if (obj[jsKey] !== undefined) row[dbKey] = obj[jsKey];
  }
  // Add audit fields if a user is signed in
  if (currentUser) {
    row.updated_by = currentUser.id;
    row.updated_by_email = currentUser.email;
    row.updated_at = new Date().toISOString();
    if (!row.created_by) {
      row.created_by = currentUser.id;
      row.created_by_email = currentUser.email;
    }
  }
  return row;
}

/* Convert snake_case database row → camelCase JS object. */
function fromDbRow(row, fieldMap) {
  const obj = {};
  for (const [jsKey, dbKey] of Object.entries(fieldMap)) {
    obj[jsKey] = row[dbKey] != null ? row[dbKey] : '';
  }
  // Pass through audit fields if present
  if (row.created_by_email) obj._createdByEmail = row.created_by_email;
  if (row.updated_by_email) obj._updatedByEmail = row.updated_by_email;
  if (row.updated_at)       obj._updatedAt = row.updated_at;
  return obj;
}

/* =================================================================
   AUTH FLOW
   ================================================================= */
async function initAuth() {
  if (!CLOUD_MODE) return null;

  // Wire up the sign-in button
  const btn = document.getElementById('googleSignInBtn');
  if (btn) {
    btn.addEventListener('click', signInWithGoogle);
  }

  // Check for existing session (set by Supabase from URL or persisted storage)
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) {
    currentUser = {
      id: session.user.id,
      email: session.user.email,
      name: session.user.user_metadata?.full_name || session.user.email
    };
    return currentUser;
  }

  // Also listen for future sign-ins (e.g. when redirect completes)
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session?.user) {
      currentUser = {
        id: session.user.id,
        email: session.user.email,
        name: session.user.user_metadata?.full_name || session.user.email
      };
      loadData().then(() => {
        subscribeRealtime();
        render();
        revealApp();
      });
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
      // Hide the app shell again so signed-out state can't see data
      const shell = document.getElementById('appShell');
      if (shell) shell.classList.add('app-hidden-until-auth');
      showLoginScreen();
    }
  });

  return null;
}

async function signInWithGoogle() {
  const btn = document.getElementById('googleSignInBtn');
  if (btn) btn.disabled = true;
  try {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.href.split('#')[0].split('?')[0]
      }
    });
    if (error) throw error;
    // Browser will redirect; no further action here.
  } catch (e) {
    console.error('Sign-in error:', e);
    showAuthError(e.message || 'Could not start sign-in. Check your internet connection and try again.');
    if (btn) btn.disabled = false;
  }
}

async function signOut() {
  if (!CLOUD_MODE) return;
  if (!confirm('Sign out? You will need to sign in again to access shared data.')) return;
  await sb.auth.signOut();
  // onAuthStateChange will show the login overlay
}

function showAuthError(message) {
  const card = document.querySelector('.auth-card');
  if (!card) return;
  let err = card.querySelector('.auth-error');
  if (!err) {
    err = document.createElement('div');
    err.className = 'auth-error';
    card.insertBefore(err, card.querySelector('.auth-btn-google'));
  }
  err.textContent = message;
}

/* =================================================================
   CLOUD DATA LAYER (Supabase reads/writes)
   ================================================================= */
async function loadDataCloud() {
  try {
    const [fu, mt, st] = await Promise.all([
      sb.from('followups').select('*').order('updated_at', { ascending: false }),
      sb.from('meetings').select('*').order('updated_at', { ascending: false }),
      sb.from('app_settings').select('data').eq('id', 1).maybeSingle()
    ]);

    if (fu.error) throw fu.error;
    if (mt.error) throw mt.error;

    state.followups = (fu.data || []).map(r => fromDbRow(r, FOLLOWUP_FIELDS));
    state.meetings  = (mt.data || []).map(r => fromDbRow(r, MEETING_FIELDS));

    if (st.data?.data) {
      state.settings = { ...DEFAULT_SETTINGS, ...st.data.data };
    } else {
      state.settings = { ...DEFAULT_SETTINGS };
    }
    setSyncStatus('connected');
  } catch (e) {
    console.error('Cloud load error:', e);
    setSyncStatus('error');
    showToast('Could not load data: ' + (e.message || 'unknown error'), 'error');
    // Fall back to local if cloud fails
    loadDataLocal();
  }
}

async function saveFollowupCloud(item) {
  const row = toDbRow(item, FOLLOWUP_FIELDS);
  const { error } = await sb.from('followups').upsert(row, { onConflict: 'id' });
  if (error) {
    console.error('Save followup error:', error);
    showToast('Save failed: ' + error.message, 'error');
    setSyncStatus('error');
    throw error;
  }
  setSyncStatus('connected');
}

async function deleteFollowupCloud(id) {
  const { error } = await sb.from('followups').delete().eq('id', id);
  if (error) { console.error(error); showToast('Delete failed: ' + error.message, 'error'); throw error; }
}

async function saveMeetingCloud(item) {
  const row = toDbRow(item, MEETING_FIELDS);
  const { error } = await sb.from('meetings').upsert(row, { onConflict: 'id' });
  if (error) { console.error(error); showToast('Save failed: ' + error.message, 'error'); throw error; }
}

async function deleteMeetingCloud(id) {
  const { error } = await sb.from('meetings').delete().eq('id', id);
  if (error) { console.error(error); showToast('Delete failed: ' + error.message, 'error'); throw error; }
}

async function saveSettingsCloud() {
  const payload = {
    id: 1,
    data: state.settings,
    updated_by: currentUser?.id || null,
    updated_at: new Date().toISOString()
  };
  const { error } = await sb.from('app_settings').upsert(payload, { onConflict: 'id' });
  if (error) { console.error(error); showToast('Settings save failed: ' + error.message, 'error'); }
}

/* =================================================================
   REAL-TIME SUBSCRIPTION
   ================================================================= */
function subscribeRealtime() {
  if (!CLOUD_MODE || !currentUser) return;
  if (realtimeChannel) sb.removeChannel(realtimeChannel);

  // Debounced reload so a burst of events triggers one refresh
  let reloadTimer = null;
  const scheduleReload = () => {
    if (reloadTimer) clearTimeout(reloadTimer);
    reloadTimer = setTimeout(async () => {
      await loadData();
      // Refresh whatever page is showing
      if (state.currentPage === 'dashboard') render();
      else if (state.currentPage === 'followups') { refreshFollowupsTable(); refreshFollowupToolbar(); }
      else if (state.currentPage === 'meetings')  { refreshMeetingsTable();  refreshMeetingToolbar(); }
      else render();
    }, 400);
  };

  realtimeChannel = sb.channel('cfms-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'followups' },    scheduleReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'meetings' },     scheduleReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, scheduleReload)
    .subscribe(status => {
      if (status === 'SUBSCRIBED') setSyncStatus('connected');
      else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') setSyncStatus('offline');
    });
}

/* Visual sync indicator */
function setSyncStatus(state) {
  const dot = document.getElementById('syncDot');
  if (!dot) return;
  dot.className = 'sync-dot' + (state === 'offline' ? ' offline' : state === 'error' ? ' error' : '');
  dot.title = state === 'connected' ? 'Connected — changes sync in real time'
            : state === 'error'     ? 'Sync error — see console for details'
            :                          'Offline — changes save locally only';
}

async function loadData() {

  if (CLOUD_MODE && currentUser && !window.__force_local__) {
    await loadDataCloud();
    return;
  }
  loadDataLocal();
}

function loadDataLocal() {
  try {
    state.followups = JSON.parse(localStorage.getItem(STORAGE_KEYS.followups) || '[]');
    state.meetings  = JSON.parse(localStorage.getItem(STORAGE_KEYS.meetings)  || '[]');
    const savedSettings = JSON.parse(localStorage.getItem(STORAGE_KEYS.settings) || 'null');
    if (savedSettings) {
      state.settings = { ...DEFAULT_SETTINGS, ...savedSettings };
    } else {
      state.settings = { ...DEFAULT_SETTINGS };
    }
  } catch (e) {
    console.error('Load error:', e);
    state.followups = [];
    state.meetings = [];
    state.settings = { ...DEFAULT_SETTINGS };
  }

  // First-run: seed sample data (local mode only)
  if (!CLOUD_MODE && !localStorage.getItem(STORAGE_KEYS.init)) {
    seedSampleData();
    localStorage.setItem(STORAGE_KEYS.init, '1');
  }
  setSyncStatus('offline');
}

function saveFollowups() {
  localStorage.setItem(STORAGE_KEYS.followups, JSON.stringify(state.followups));
}
function saveMeetings() {
  localStorage.setItem(STORAGE_KEYS.meetings,  JSON.stringify(state.meetings));
}
function saveSettings() {
  localStorage.setItem(STORAGE_KEYS.settings,  JSON.stringify(state.settings));
  // Push to cloud if in multi-user mode
  if (CLOUD_MODE && currentUser && !window.__force_local__) {
    saveSettingsCloud();
  }
}

/* -----------------------------------------------------------------
   5. UTILITIES
   ----------------------------------------------------------------- */
function uid() { return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function todayISO() { return new Date().toISOString().slice(0,10); }

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function daysBetween(isoDate) {
  if (!isoDate) return null;
  const target = new Date(isoDate + 'T00:00:00');
  const now = new Date(todayISO() + 'T00:00:00');
  return Math.round((target - now) / (1000 * 60 * 60 * 24));
}

function isOverdue(item) {
  if (!item.dueDate) return false;
  if (item.status === 'Completed' || item.status === 'Cancelled') return false;
  return daysBetween(item.dueDate) < 0;
}

function isDueSoon(item) {
  if (!item.dueDate) return false;
  if (item.status === 'Completed' || item.status === 'Cancelled') return false;
  const days = daysBetween(item.dueDate);
  return days >= 0 && days <= 7;
}

function statusBadgeClass(status) {
  switch (status) {
    case 'Completed': return 'badge-completed';
    case 'In Progress': return 'badge-inprogress';
    case 'Pending Contractor':
    case 'Pending Approval':
    case 'Pending Material': return 'badge-pending';
    case 'On Hold': return 'badge-onhold';
    case 'Not Started': return 'badge-notstarted';
    case 'Cancelled': return 'badge-cancelled';
    default: return 'badge-default';
  }
}

/* Return the Lucide icon name representing each status — per the icon system spec.
   Each pending state gets a distinct icon since they share the same color. */
function statusIconName(status) {
  switch (status) {
    case 'Completed':           return 'circle-check-big';
    case 'In Progress':         return 'circle-dot';
    case 'Pending Contractor':  return 'hourglass';
    case 'Pending Approval':    return 'stamp';
    case 'Pending Material':    return 'package-search';
    case 'On Hold':             return 'pause-circle';
    case 'Not Started':         return 'circle';
    case 'Cancelled':           return 'circle-x';
    default:                    return 'circle';
  }
}

/* Build a status badge with inline icon. Use this everywhere instead of inline templates. */
function statusBadge(status) {
  return `<span class="badge ${statusBadgeClass(status)}"><i data-lucide="${statusIconName(status)}" class="icon-xs"></i>${escapeHtml(status)}</span>`;
}

function showToast(message, type) {
  const t = document.getElementById('toast');
  t.textContent = message;
  t.className = 'toast show ' + (type || '');
  setTimeout(() => { t.className = 'toast ' + (type || ''); }, 2400);
}

  };

  // User badge + sync indicator (only when signed in to cloud mode)

  if (CLOUD_MODE && currentUser) {
    userArea.style.display = 'inline-flex';
    const initials = (currentUser.name || currentUser.email || '?')
      .split(/[ @.]/).filter(Boolean).slice(0, 2)
      .map(s => s[0].toUpperCase()).join('') || '?';
    document.getElementById('userAvatar').textContent = initials;
    document.getElementById('userName').textContent = currentUser.name || currentUser.email;
    document.getElementById('userBadge').title = 'Signed in as ' + (currentUser.email || '') + ' — click to sign out';
  } else {
    userArea.style.display = 'none';
  }

  // Topbar actions per page
  const actions = document.getElementById('topbarActions');
  actions.innerHTML = '';
  if (state.currentPage === 'followups') {
    actions.innerHTML = `<button class="btn btn-primary" onclick="openFollowupModal()"><i data-lucide="plus" class="icon-md"></i><span>Add New Item</span></button>`;
  } else if (state.currentPage === 'meetings') {
    actions.innerHTML = `<button class="btn btn-primary" onclick="openMeetingModal()"><i data-lucide="plus" class="icon-md"></i><span>Add Meeting Note</span></button>`;
  }

  const content = document.getElementById('content');
  switch (state.currentPage) {
    case 'dashboard': content.innerHTML = renderDashboard(); afterDashboardRender(); break;
    case 'followups': content.innerHTML = renderFollowups(); afterFollowupsRender(); break;
    case 'meetings':  content.innerHTML = renderMeetings();  afterMeetingsRender(); break;
    case 'settings':  content.innerHTML = renderSettings();  afterSettingsRender(); break;
    case 'data':      content.innerHTML = renderDataPage();  afterDataRender(); break;
  }
  renderIcons();
}

/* ================================================================
   INLINE LUCIDE ICON REGISTRY
   No CDN dependency. Each entry is the inner markup of an SVG
   (paths/lines/circles only). The wrapper <svg> is built at render
   time with the correct viewBox, fill, stroke, and stroke-width.
   Icons sourced from Lucide (ISC license).
