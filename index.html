/* Replace every <i data-lucide="..."> placeholder with an inline SVG.
   Safe to call any number of times; placeholders are removed once rendered. */
function renderIcons() {
  const placeholders = document.querySelectorAll('i[data-lucide]');
  placeholders.forEach(el => {
    const name = el.getAttribute('data-lucide');
    const inner = LUCIDE_SVG[name];
    if (!inner) {
      // Unknown icon name — log once and hide the placeholder
      console.warn('Lucide icon not in registry:', name);
      el.style.display = 'none';
      return;
    }
    // Build a wrapper svg matching Lucide's standard attributes
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    // Copy classes from placeholder to svg so sizing tokens (.icon-md etc.) carry over
    if (el.className) svg.setAttribute('class', el.className);
    svg.innerHTML = inner;
    el.replaceWith(svg);
  });
}

/* ================================================================
   GATE HELPERS — control what the user sees during boot
   ================================================================ */
function hideLoadingScreen() {
  const el = document.getElementById('authLoading');
  if (el) el.style.display = 'none';
}

function revealApp() {
  hideLoadingScreen();
  const shell = document.getElementById('appShell');
  if (shell) shell.classList.remove('app-hidden-until-auth');
  const overlay = document.getElementById('authOverlay');
  if (overlay) overlay.style.display = 'none';
}

function showLoginScreen() {
  hideLoadingScreen();
  // App shell stays hidden — login overlay shows alone
  const overlay = document.getElementById('authOverlay');
  if (overlay) overlay.style.display = 'flex';
}

/* -----------------------------------------------------------------
   8. DASHBOARD
   ----------------------------------------------------------------- */
function renderDashboard() {
  const items = state.followups;
  const total = items.length;
  const completed = items.filter(i => i.status === 'Completed').length;
  const cancelled = items.filter(i => i.status === 'Cancelled').length;
  const open = total - completed - cancelled;
  const overdueItems = items.filter(isOverdue);
  const overdue = overdueItems.length;
  const dueSoonItems = items.filter(i => isDueSoon(i) && !isOverdue(i));
  const dueSoon = dueSoonItems.length;
  const completionRate = total > 0 ? Math.round((completed / total) * 100) : 0;

  const byStatus = countBy(items, 'status');
  const byCategory = countBy(items, 'category');

  // ===== TIER 1: STATUS BAR (one element, says it all) =====
  let barCls, eyebrow, title;
  if (total === 0) {
    barCls = 'empty';
    eyebrow = 'Getting started';
    title = 'No follow-up items yet — add your first one';
  } else if (overdue > 0) {
    barCls = 'alert';
    eyebrow = 'Action required';
    title = `${overdue} ${overdue === 1 ? 'item is overdue' : 'items are overdue'}`;
  } else if (dueSoon > 0) {
    barCls = 'warn';
    eyebrow = 'Coming up this week';
    title = `${dueSoon} ${dueSoon === 1 ? 'item due' : 'items due'} within 7 days`;
  } else {
    barCls = 'clear';
    eyebrow = 'All clear';
    title = 'Nothing overdue, nothing urgent';
  }

  const statusBar = `
    <div class="status-bar ${barCls}">
      <div class="status-bar-headline">
        <div class="status-bar-eyebrow">${eyebrow}</div>
        <h2 class="status-bar-title">${escapeHtml(title)}</h2>
      </div>
      <div></div>
      <div class="status-bar-stats">
        <div class="status-stat">
          <div class="status-stat-value danger">${overdue}</div>
          <div class="status-stat-label"><i data-lucide="alert-triangle" class="icon-xs"></i>Overdue</div>
        </div>
        <div class="status-stat-divider"></div>
        <div class="status-stat">
          <div class="status-stat-value warning">${dueSoon}</div>
          <div class="status-stat-label"><i data-lucide="clock" class="icon-xs"></i>Due 7d</div>
        </div>
        <div class="status-stat-divider"></div>
        <div class="status-stat">
          <div class="status-stat-value">${open}</div>
          <div class="status-stat-label"><i data-lucide="circle-dot" class="icon-xs"></i>Open</div>
        </div>
        <div class="status-stat-divider"></div>
        <div class="status-stat">
          <div class="status-stat-value success">${completed}</div>
          <div class="status-stat-label"><i data-lucide="circle-check-big" class="icon-xs"></i>Done</div>
        </div>
      </div>
    </div>
  `;

  // ===== TIER 2: 2-COLUMN GRID — Action Queue + Side Panel =====
  // Action Queue: overdue + due this week, sorted by urgency
  const queueItems = [];
  overdueItems.forEach(item => queueItems.push({ ...item, _days: daysBetween(item.dueDate) }));
  dueSoonItems.forEach(item => queueItems.push({ ...item, _days: daysBetween(item.dueDate) }));
  queueItems.sort((a, b) => a._days - b._days);

  // If queue empty, show upcoming (next 14 days) so the panel isn't empty
  let queueShownItems = queueItems;
  let queueTitle = 'Action Queue — Next 7 Days';
  if (!queueItems.length) {
    const fallback = items
      .filter(i => i.status !== 'Completed' && i.status !== 'Cancelled' && i.dueDate)
      .map(i => ({ ...i, _days: daysBetween(i.dueDate) }))
      .filter(i => i._days > 7 && i._days <= 30)
      .sort((a, b) => a._days - b._days)
      .slice(0, 8);
    if (fallback.length) {
      queueShownItems = fallback;
      queueTitle = 'Upcoming — Next 30 Days';
    }
  }

  const queueBody = queueShownItems.length === 0
    ? `<div class="action-queue-empty">
         <div class="action-queue-empty-icon"><i data-lucide="check-circle-2" class="icon-2xl"></i></div>
         <div>Nothing urgent right now. Great work.</div>
       </div>`
    : queueShownItems.map(item => {
        const days = item._days;
        let whenCls, whenDays, whenLabel;
        if (days < 0) {
          whenCls = 'overdue';
          whenDays = Math.abs(days) + 'd';
          whenLabel = 'Late';
        } else if (days === 0) {
          whenCls = 'today';
          whenDays = '●';
          whenLabel = 'Today';
        } else if (days <= 7) {
          whenCls = 'soon';
          whenDays = days + 'd';
          whenLabel = 'Left';
        } else {
          whenCls = '';
          whenDays = days + 'd';
          whenLabel = 'Out';
        }
        return `
          <div class="action-queue-item" onclick="openFollowupModal('${item.id}')">
            <div class="action-queue-when ${whenCls}">
              <span class="action-queue-when-days">${whenDays}</span>
              <span>${whenLabel}</span>
            </div>
            <div class="action-queue-content">
              <div class="action-queue-itemtitle">${escapeHtml(item.title)}</div>
              <div class="action-queue-meta">
                ${escapeHtml(item.project || '—')} · ${escapeHtml(item.assignee || 'Unassigned')}
              </div>
            </div>
            ${statusBadge(item.status)}
          </div>
        `;
      }).join('');

  const actionQueue = `
    <div class="action-queue-card">
      <div class="action-queue-header">
        <h3 class="action-queue-title"><i data-lucide="target" class="icon-sm"></i>${queueTitle}</h3>
        ${queueShownItems.length > 0 ? `<span class="action-queue-count${overdue > 0 ? ' danger' : ''}">${queueShownItems.length}</span>` : ''}
      </div>
      <div class="action-queue-body">${queueBody}</div>
    </div>
  `;

  // Side panel: Completion ring + Status breakdown + Category breakdown (top 5)
  const completionRing = buildCompletionRing(completionRate);
  const sideStatusBreakdown = renderCompactBreakdown(byStatus, total, 5);
  const sideCategoryBreakdown = renderCompactBreakdown(byCategory, total, 5);

  const sidePanel = `
    <div class="side-panel">
      <div class="side-card">
        <div class="side-card-header"><i data-lucide="trending-up" class="icon-sm"></i>Progress</div>
        <div class="side-card-body">
          <div class="completion-ring-wrap">
            ${completionRing}
            <div class="completion-ring-text">
              <div class="completion-ring-percent">${completionRate}%</div>
              <div class="completion-ring-label">${completed} of ${total} items completed</div>
            </div>
          </div>
        </div>
      </div>

      <div class="side-card">
        <div class="side-card-header"><i data-lucide="pie-chart" class="icon-sm"></i>By Status</div>
        <div class="side-card-body">
          ${sideStatusBreakdown}
        </div>
      </div>

      <div class="side-card">
        <div class="side-card-header"><i data-lucide="tag" class="icon-sm"></i>By Category (Top 5)</div>
        <div class="side-card-body">
          ${sideCategoryBreakdown}
        </div>
      </div>
    </div>
  `;

  const grid = `
    <div class="dashboard-grid">
      ${actionQueue}
      ${sidePanel}
    </div>
  `;

  // ===== TIER 3: SUPPORTING (calendar, full timeline) — clearly secondary =====
  const supporting = `
    <div class="supporting-section-title">Calendar</div>
    <div class="calendar" id="calendarBox">
      ${renderCalendar()}
    </div>

    <div class="supporting-section-title">Full Timeline — All Follow-up & Due Dates</div>
    <div class="card">
      ${renderTimeline(getAllTimelineItems())}
    </div>
  `;

  return statusBar + grid + supporting;
}

/* Build an SVG ring chart for completion percentage. */
function buildCompletionRing(percent) {
  const size = 80;
  const stroke = 9;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (percent / 100) * c;
  return `
    <svg class="completion-ring" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}"
        stroke="var(--color-neutral-100)" stroke-width="${stroke}" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}"
        stroke="var(--color-success-500)" stroke-width="${stroke}" fill="none"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        stroke-linecap="round"
        transform="rotate(-90 ${size/2} ${size/2})"
        style="transition: stroke-dashoffset var(--motion-slow);"/>
    </svg>
  `;
}

/* Render compact breakdown with proportional bars. */
function renderCompactBreakdown(entries, total, limit) {
  if (!entries.length) return '<div class="text-sm text-muted">No data yet</div>';
  const shown = entries.slice(0, limit);
  const max = shown[0] ? shown[0][1] : 1;
  return `<ul class="compact-breakdown">${shown.map(([name, count]) => {
    const pct = max > 0 ? Math.round((count / max) * 100) : 0;
    return `
      <li class="compact-breakdown-item">
        <span class="compact-breakdown-name">${escapeHtml(name)}</span>
        <span class="compact-breakdown-bar"><span class="compact-breakdown-fill" style="width:${pct}%"></span></span>
        <span class="compact-breakdown-count">${count}</span>
      </li>
    `;
  }).join('')}</ul>`;
}

/* Helper: navigate to follow-up list with a preset filter */
function goToFiltered(preset) {
  if (preset === 'overdue') {
    state.filters = { search:'', project:[], category:[], status:[], assignee:[], dateFrom:'', dateTo:'' };
    state.sort = { field: 'dueDate', dir: 'asc' };
  } else if (preset === 'week') {
    const today = todayISO();
    const future = new Date();
    future.setDate(future.getDate() + 7);
    state.filters = { search:'', project:[], category:[], status:[], assignee:[], dateFrom: today, dateTo: future.toISOString().slice(0,10) };
    state.sort = { field: 'dueDate', dir: 'asc' };
  }
  navigate('followups');
}

function countBy(items, field) {
  const map = {};
  items.forEach(i => {
    const k = i[field] || '(Unset)';
    map[k] = (map[k] || 0) + 1;
  });
  // Sort by count descending
  return Object.entries(map).sort((a,b) => b[1] - a[1]);
}

function renderBreakdownList(entries) {
  if (!entries.length) return '<div class="empty-state text-sm">No data yet</div>';
  return `<ul class="breakdown-list">${entries.map(([name, count]) => `
    <li class="breakdown-item">
      <span class="breakdown-name">${escapeHtml(name)}</span>
      <span class="breakdown-count">${count}</span>
    </li>
  `).join('')}</ul>`;
}

function getUpcomingItems(days) {
  const result = [];
  state.followups.forEach(item => {
    if (item.status === 'Completed' || item.status === 'Cancelled') return;
    if (item.followUpDate) {
      const d = daysBetween(item.followUpDate);
      if (d >= 0 && d <= days) result.push({ ...item, _dateType: 'Follow-up', _date: item.followUpDate });
    }
    if (item.dueDate) {
      const d = daysBetween(item.dueDate);
      if (d >= 0 && d <= days) result.push({ ...item, _dateType: 'Due Date', _date: item.dueDate });
    }
  });
  result.sort((a,b) => a._date.localeCompare(b._date));
  return result;
}

function getOverdueItems() {
  return state.followups
    .filter(isOverdue)
    .map(i => ({ ...i, _dateType: 'Due Date', _date: i.dueDate }))
    .sort((a,b) => a._date.localeCompare(b._date));
}

function getAllTimelineItems() {
  const result = [];
  state.followups.forEach(item => {
    if (item.followUpDate) result.push({ ...item, _dateType: 'Follow-up', _date: item.followUpDate });
    if (item.dueDate)      result.push({ ...item, _dateType: 'Due Date',  _date: item.dueDate });
  });
  result.sort((a,b) => a._date.localeCompare(b._date));
  return result;
}

function renderTimeline(items) {
  if (!items.length) return '<div class="empty-state text-sm">No items to show</div>';
  return `<ul class="timeline-list">${items.map(item => {
    const overdue = isOverdue(item) && item._dateType === 'Due Date';
    const soon = isDueSoon(item) && !overdue;
    const done = item.status === 'Completed';
    let cls = '';
    if (done) cls = 'completed';
    else if (overdue) cls = 'overdue';
    else if (soon) cls = 'duesoon';
    return `
      <li class="timeline-item ${cls}">
        <div class="timeline-date">${formatDate(item._date)}</div>
        <div class="timeline-type">${item._dateType}</div>
        <div class="timeline-content">
          <div class="timeline-title">${escapeHtml(item.title)}</div>
          <div class="timeline-meta">
            ${escapeHtml(item.project || '—')} · ${escapeHtml(item.location || '—')} · ${escapeHtml(item.assignee || '—')}
          </div>
        </div>
        ${statusBadge(item.status)}
      </li>
    `;
  }).join('')}</ul>`;
}

/* -----------------------------------------------------------------
   9. CALENDAR VIEW
   ----------------------------------------------------------------- */
function renderCalendar() {
  const year = state.calendar.year;
  const month = state.calendar.month;
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startWeekday = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const today = todayISO();

  // Build map: date -> {followup:[], due:[], overdue:[]}
  const map = {};
  state.followups.forEach(item => {
    if (item.followUpDate) {
      const k = item.followUpDate;
      if (!map[k]) map[k] = { followup: [], due: [], overdue: [] };
      map[k].followup.push(item);
    }
    if (item.dueDate) {
      const k = item.dueDate;
      if (!map[k]) map[k] = { followup: [], due: [], overdue: [] };
      if (isOverdue(item)) map[k].overdue.push(item);
      else map[k].due.push(item);
    }
  });

  let cells = '';
  // Empty cells before first day
  for (let i = 0; i < startWeekday; i++) {
    cells += `<div class="calendar-day empty"></div>`;
  }
  // Day cells
  for (let day = 1; day <= totalDays; day++) {
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayData = map[iso];
    const isToday = iso === today;
    let dots = '';
    if (dayData) {
      if (dayData.overdue.length) dots += `<span class="cal-dot cal-dot-overdue" title="Overdue">⚠ ${dayData.overdue.length}</span>`;
      if (dayData.due.length)     dots += `<span class="cal-dot cal-dot-due" title="Due">D ${dayData.due.length}</span>`;
      if (dayData.followup.length) dots += `<span class="cal-dot cal-dot-followup" title="Follow-up">F ${dayData.followup.length}</span>`;
    }
    cells += `
      <div class="calendar-day ${isToday ? 'today' : ''}" onclick="showCalendarDay('${iso}')">
        <div class="calendar-day-number">${day}</div>
        <div class="calendar-day-indicators">${dots}</div>
      </div>
    `;
  }

  return `
    <div class="calendar-header">
      <div class="calendar-title">Calendar View — ${monthNames[month]} ${year}</div>
      <div class="calendar-controls">
        <button class="btn btn-secondary btn-sm" onclick="changeCalendar(-1)" aria-label="Previous month"><i data-lucide="chevron-left" class="icon-md"></i></button>
        <button class="btn btn-secondary btn-sm" onclick="goToCurrentMonth()">Today</button>
        <button class="btn btn-secondary btn-sm" onclick="changeCalendar(1)" aria-label="Next month"><i data-lucide="chevron-right" class="icon-md"></i></button>
      </div>
    </div>
    <div class="calendar-grid">
      <div class="calendar-day-header">Sun</div>
      <div class="calendar-day-header">Mon</div>
      <div class="calendar-day-header">Tue</div>
      <div class="calendar-day-header">Wed</div>
      <div class="calendar-day-header">Thu</div>
      <div class="calendar-day-header">Fri</div>
      <div class="calendar-day-header">Sat</div>
      ${cells}
    </div>
    <div class="calendar-legend">
      <span class="legend-item"><span class="legend-swatch" style="background:var(--color-info-100);"></span>F = Follow-up Date</span>
      <span class="legend-item"><span class="legend-swatch" style="background:var(--color-warning-100);"></span>D = Due Date</span>
      <span class="legend-item"><span class="legend-swatch" style="background:var(--color-danger-100);"></span>⚠ = Overdue</span>
    </div>
  `;
}

function changeCalendar(delta) {
  state.calendar.month += delta;
  if (state.calendar.month < 0) { state.calendar.month = 11; state.calendar.year--; }
  if (state.calendar.month > 11) { state.calendar.month = 0;  state.calendar.year++; }
  document.getElementById('calendarBox').innerHTML = renderCalendar();
  renderIcons();
}

function goToCurrentMonth() {
  const now = new Date();
  state.calendar.year = now.getFullYear();
  state.calendar.month = now.getMonth();
  document.getElementById('calendarBox').innerHTML = renderCalendar();
  renderIcons();
}

function showCalendarDay(iso) {
  const items = [];
  state.followups.forEach(item => {
    if (item.followUpDate === iso) items.push({ ...item, _dateType: 'Follow-up', _date: iso });
    if (item.dueDate === iso)      items.push({ ...item, _dateType: 'Due Date', _date: iso });
  });
  const title = `Items on ${formatDate(iso)}`;
  let body;
  if (!items.length) {
    body = '<div class="empty-state">No follow-up or due date items on this day.</div>';
  } else {
    body = renderTimeline(items);
  }
  openInfoModal(title, body);
}

/* Count non-search filters that are active (so the Filter button can show a count).
   For array filters, each selected value counts as one. */
function countActiveFollowupFilters() {
  const f = state.filters;
  let n = 0;
  n += f.project.length;
  n += f.category.length;
  n += f.status.length;
  n += f.assignee.length;
  if (f.dateFrom) n++;
  if (f.dateTo) n++;
  return n;
}

/* Render the active filter chips (excluding search, which is its own input).
   For array filters, render one chip per selected value with an index for individual removal. */
function renderFollowupActiveChips() {
  const f = state.filters;
  const chips = [];
  f.project.forEach((v, i)  => chips.push(buildArrayChip('Project',  v, 'project',  i)));
  f.category.forEach((v, i) => chips.push(buildArrayChip('Category', v, 'category', i)));
  f.status.forEach((v, i)   => chips.push(buildArrayChip('Status',   v, 'status',   i)));
  f.assignee.forEach((v, i) => chips.push(buildArrayChip('Assignee', v, 'assignee', i)));
  if (f.dateFrom) chips.push(buildChip('From', formatDate(f.dateFrom), 'dateFrom'));
  if (f.dateTo)   chips.push(buildChip('To',   formatDate(f.dateTo),   'dateTo'));
  if (!chips.length) return '';
  return chips.join('') + `<button class="toolbar-clear-all" onclick="clearAllFollowupFilters()">Clear all</button>`;
}

function buildArrayChip(keyLabel, value, fieldName, index) {
  return `
    <span class="filter-chip">
      <span class="filter-chip-key">${escapeHtml(keyLabel)}</span>
      <span>${escapeHtml(value)}</span>
      <button class="filter-chip-remove" onclick="removeFollowupArrayFilter('${fieldName}', ${index})" title="Remove"><i data-lucide="x" class="icon-sm"></i></button>
    </span>
  `;
}

function buildChip(keyLabel, value, fieldName) {
  return `
    <span class="filter-chip">
      <span class="filter-chip-key">${escapeHtml(keyLabel)}</span>
      <span>${escapeHtml(value)}</span>
      <button class="filter-chip-remove" onclick="removeFollowupFilter('${fieldName}')" title="Remove"><i data-lucide="x" class="icon-sm"></i></button>
    </span>
  `;
}

function removeFollowupFilter(field) {
  // For scalar fields (dates) — clear the string value
  state.filters[field] = '';
  refreshFollowupsTable();
  refreshFollowupToolbar();
}

function removeFollowupArrayFilter(field, index) {
  // Remove a single value from an array filter
  state.filters[field].splice(index, 1);
  refreshFollowupsTable();
  refreshFollowupToolbar();
}

function clearAllFollowupFilters() {
  state.filters = {
    search: state.filters.search,
    project: [], category: [], status: [], assignee: [],
    dateFrom: '', dateTo: ''
  };
  refreshFollowupsTable();
  refreshFollowupToolbar();
}

/* Refresh just the toolbar buttons + chips after filter state changes. */
function refreshFollowupToolbar() {
  const chips = document.getElementById('followupChips');
  if (chips) chips.innerHTML = renderFollowupActiveChips();
  const filterBtn = document.getElementById('followupFilterBtn');
  if (filterBtn) {
    const count = countActiveFollowupFilters();
    filterBtn.classList.toggle('active', count > 0);
    filterBtn.innerHTML = `
      <i data-lucide="sliders-horizontal" class="icon-md"></i>
      <span>Filters</span>
      ${count > 0 ? `<span class="toolbar-btn-count">${count}</span>` : ''}
      <i data-lucide="chevron-down" class="icon-sm toolbar-btn-caret"></i>
    `;
  }
  renderIcons();
}

function getFilteredFollowups() {
  let items = state.followups.slice();
  const f = state.filters;

  if (f.search) {
    const q = f.search.toLowerCase();
    items = items.filter(i =>
      (i.title || '').toLowerCase().includes(q) ||
      (i.details || '').toLowerCase().includes(q) ||
      (i.location || '').toLowerCase().includes(q) ||
      (i.assignee || '').toLowerCase().includes(q) ||
      (i.status || '').toLowerCase().includes(q)
    );
  }
  if (f.project.length)  items = items.filter(i => f.project.includes(i.project));
  if (f.category.length) items = items.filter(i => f.category.includes(i.category));
  if (f.status.length)   items = items.filter(i => f.status.includes(i.status));
  if (f.assignee.length) items = items.filter(i => f.assignee.includes(i.assignee));
  if (f.dateFrom) items = items.filter(i => i.dueDate && i.dueDate >= f.dateFrom);
  if (f.dateTo)   items = items.filter(i => i.dueDate && i.dueDate <= f.dateTo);

  // Sort. Empty values for date fields always sink to the bottom so urgent items rise.
  const { field, dir } = state.sort;
  const isDateField = field === 'dueDate' || field === 'followUpDate' || field === 'dateAdded';
  items.sort((a, b) => {
    const av = (a[field] || '').toString();
    const bv = (b[field] || '').toString();
    // For date fields, push empty values to the end regardless of direction.
    if (isDateField) {
      if (!av && !bv) return 0;
      if (!av) return 1;
      if (!bv) return -1;
    }
    if (av === bv) return 0;
    const cmp = av < bv ? -1 : 1;
    return dir === 'asc' ? cmp : -cmp;
  });
  return items;
}

function renderFollowupRows() {
  const items = getFilteredFollowups();
  if (!items.length) {
    return `<div class="empty-state">No items match your filters. Try resetting filters or adding a new item.</div>`;
  }
  return items.map(item => {
    const overdue = isOverdue(item);
    const dueSoon = isDueSoon(item) && !overdue;
    const completed = item.status === 'Completed';

    let rowCls = 'item-row';
    if (overdue) rowCls += ' is-overdue';
    else if (dueSoon) rowCls += ' is-duesoon';
    if (completed) rowCls += ' is-completed';

    // ----- Due date pill (the scanning signal) -----
    const duePill = buildDuePill(item, overdue, dueSoon, completed);

    // ----- Follow-up date column -----
    const followupCol = item.followUpDate
      ? `<div class="item-followup-date">${formatDate(item.followUpDate)}</div>`
      : `<div class="item-followup-empty">—</div>`;

    // ----- Metadata chips (Project · Category · Location) -----
    const metaChips = [
      item.project    ? `<span class="item-meta-chip"><i data-lucide="building-2" class="icon-sm item-meta-chip-icon"></i>${escapeHtml(item.project)}</span>` : '',
      item.category   ? `<span class="item-meta-chip"><i data-lucide="tag" class="icon-sm item-meta-chip-icon"></i>${escapeHtml(item.category)}</span>` : '',
      item.location   ? `<span class="item-meta-chip"><i data-lucide="map-pin" class="icon-sm item-meta-chip-icon"></i>${escapeHtml(item.location)}</span>` : '',
      item.assignee   ? `<span class="item-meta-chip"><i data-lucide="user-round" class="icon-sm item-meta-chip-icon"></i>${escapeHtml(item.assignee)}</span>` : ''
    ].filter(Boolean).join('');

    // ----- Latest update (only shown if present) -----
    const updateLine = item.latestUpdate
      ? `<div class="item-update"><span class="item-update-label">Update</span>${escapeHtml(item.latestUpdate.slice(0,140))}${item.latestUpdate.length>140?'…':''}</div>`
      : '';

    return `
      <div class="${rowCls}" data-id="${item.id}">
        <div class="item-urgency"></div>
        ${duePill}
        <div class="item-content">
          <div class="item-title">${escapeHtml(item.title || '(Untitled)')}</div>
          <div class="item-meta">${metaChips}</div>
          ${updateLine}
        </div>
        <div class="item-followup">
          <div class="item-followup-label">Follow-up</div>
          ${followupCol}
        </div>
        <div class="item-status">
          ${statusBadge(item.status)}
        </div>
      </div>
    `;
  }).join('');
}

/* Build the due-date pill. Returns HTML for a column that shows urgency at a glance. */
function buildDuePill(item, overdue, dueSoon, completed) {
  if (!item.dueDate) {
    return `<div class="due-pill none">
      <div class="due-pill-big">—</div>
      <div class="due-pill-label">No Due</div>
    </div>`;
  }

  if (completed) {
    return `<div class="due-pill future">
      <div class="due-pill-date">${formatDate(item.dueDate)}</div>
      <div class="due-pill-label">Done</div>
    </div>`;
  }

  const days = daysBetween(item.dueDate);
  if (days < 0) {
    const late = Math.abs(days);
    return `<div class="due-pill overdue">
      <div class="due-pill-big">${late}d</div>
      <div class="due-pill-label">Late</div>
    </div>`;
  }
  if (days === 0) {
    return `<div class="due-pill today">
      <div class="due-pill-big">●</div>
      <div class="due-pill-label">Today</div>
    </div>`;
  }
  if (days <= 7) {
    return `<div class="due-pill soon">
      <div class="due-pill-big">${days}d</div>
      <div class="due-pill-label">Left</div>
    </div>`;
  }
  // Future (>7 days): show date itself, neutral style
  return `<div class="due-pill future">
    <div class="due-pill-date">${formatDate(item.dueDate)}</div>
    <div class="due-pill-label">Due</div>
  </div>`;
}

function refreshFollowupsTable() {
  const tbody = document.getElementById('followupsTbody');
  if (tbody) { tbody.innerHTML = renderFollowupRows(); renderIcons(); }
}

/* ================================================================
   POPOVER SYSTEM (anchored to a trigger button)
   ================================================================ */
let _popoverOpen = false;

function openPopover(triggerEl, contentHTML, opts) {
  opts = opts || {};
  const pop = document.getElementById('popover');
  const back = document.getElementById('popoverBackdrop');
  pop.innerHTML = contentHTML;
  pop.className = 'popover ' + (opts.className || '');
  pop.style.display = 'block';
  back.classList.add('show');
  _popoverOpen = true;
  renderIcons();

  // Position the popover below the trigger button (after icons render to get accurate size)
  positionPopover(triggerEl, pop);

  // Close on backdrop click
  back.onclick = closePopover;

  // Close on Escape
  const onKey = (e) => {
    if (e.key === 'Escape') closePopover();
  };
  document.addEventListener('keydown', onKey, { once: true });

  // Reposition on window resize/scroll (best-effort)
  const onResize = () => positionPopover(triggerEl, pop);
  window.addEventListener('resize', onResize);
  pop._cleanup = () => window.removeEventListener('resize', onResize);

  if (opts.onOpen) opts.onOpen(pop);
}

function positionPopover(triggerEl, pop) {
  const rect = triggerEl.getBoundingClientRect();
  const popWidth = pop.offsetWidth || 320;
  const popHeight = pop.offsetHeight || 200;
  const margin = 8;

  // Default: below trigger, left-aligned to it
  let top = rect.bottom + window.scrollY + 4;
  let left = rect.left + window.scrollX;

  // If popover would overflow right edge, shift left
  if (left + popWidth > window.innerWidth - margin) {
    left = Math.max(margin, window.innerWidth - popWidth - margin);
  }
  // If popover would overflow bottom, place above the trigger
  if (rect.bottom + popHeight + 12 > window.innerHeight && rect.top > popHeight + 12) {
    top = rect.top + window.scrollY - popHeight - 4;
  }

  pop.style.top = top + 'px';
  pop.style.left = left + 'px';
}

function closePopover() {
  if (!_popoverOpen) return;
  const pop = document.getElementById('popover');
  const back = document.getElementById('popoverBackdrop');
  if (pop._cleanup) pop._cleanup();
  pop.style.display = 'none';
  pop.innerHTML = '';
  pop.style.top = pop.style.left = '';
  back.classList.remove('show');
  back.onclick = null;
  _popoverOpen = false;
}

window.closePopover = closePopover;

          <h4 class="filter-section-title"><i data-lucide="building-2" class="icon-sm"></i>Project / Zone</h4>

        </div>
        <div class="filter-section">
          <h4 class="filter-section-title"><i data-lucide="tag" class="icon-sm"></i>Category</h4>
          <div class="chip-group">${buildChips(state.settings.categories, draft.category, 'category')}</div>
        </div>
        <div class="filter-section">
          <h4 class="filter-section-title"><i data-lucide="user-round" class="icon-sm"></i>Assignee</h4>
          <div class="chip-group">${buildChips(state.settings.assignees, draft.assignee, 'assignee')}</div>
        </div>
        <div class="filter-section">
          <h4 class="filter-section-title"><i data-lucide="calendar-x" class="icon-sm"></i>Due Date Range</h4>
          <div class="filter-date-row">
            <div>
              <label class="filter-date-label">From</label>
              <input type="date" class="filter-date-input" id="popDateFrom" value="${escapeHtml(draft.dateFrom)}">
            </div>
            <div>
              <label class="filter-date-label">To</label>
              <input type="date" class="filter-date-input" id="popDateTo" value="${escapeHtml(draft.dateTo)}">
            </div>
          </div>
        </div>
      </div>
      <div class="popover-footer">
        <button class="btn btn-secondary btn-sm" onclick="resetDraftFollowupFilters()">Clear all</button>
        <div class="flex gap-2">
          <button class="btn btn-secondary" onclick="closePopover()">Cancel</button>
          <button class="btn btn-primary" id="applyFollowupFilters">Apply</button>
        </div>
      </div>
    </div>
  `;

  openPopover(triggerEl, content, {
    onOpen: (pop) => {
      // Multi-select chip toggle: clicking a chip toggles its presence in the array.
      pop.querySelectorAll('.chip-option').forEach(chip => {
        chip.addEventListener('click', () => {
          const field = chip.dataset.field;
          const value = chip.dataset.value;
          const arr = draft[field];
          const idx = arr.indexOf(value);
          if (idx >= 0) arr.splice(idx, 1);
          else arr.push(value);
          chip.classList.toggle('selected', arr.includes(value));
        });
      });

      // Apply
      pop.querySelector('#applyFollowupFilters').addEventListener('click', () => {
        draft.dateFrom = pop.querySelector('#popDateFrom').value;
        draft.dateTo   = pop.querySelector('#popDateTo').value;
        state.filters = draft;
        refreshFollowupsTable();
        refreshFollowupToolbar();
        closePopover();
      });

      // Clear all (reset draft + visuals)
      window.resetDraftFollowupFilters = () => {
        draft.project.length = 0;
        draft.category.length = 0;
        draft.status.length = 0;
        draft.assignee.length = 0;
        draft.dateFrom = '';
        draft.dateTo = '';
        pop.querySelectorAll('.chip-option').forEach(c => c.classList.remove('selected'));
        pop.querySelector('#popDateFrom').value = '';
        pop.querySelector('#popDateTo').value = '';
      };
    }
  });
}

/* ================================================================
   FOLLOW-UP SORT POPOVER
   ================================================================ */
const FOLLOWUP_SORT_FIELDS = [
  { value: 'dueDate',      label: 'Due Date' },
  { value: 'followUpDate', label: 'Follow-up Date' },
  { value: 'status',       label: 'Status' },
  { value: 'project',      label: 'Project / Zone' },
  { value: 'assignee',     label: 'Assignee' },
  { value: 'dateAdded',    label: 'Date Added' }
];

function openFollowupSortPopover(triggerEl) {
  const draft = { ...state.sort };

  const content = `
    <div class="popover-sort">
      <div class="sort-section-title">Sort by</div>
      ${FOLLOWUP_SORT_FIELDS.map(f => `
        <div class="sort-option ${draft.field === f.value ? 'selected' : ''}" data-field="${f.value}">
          <span class="sort-option-radio"></span>
          <span>${f.label}</span>
        </div>
      `).join('')}
      <div class="sort-divider"></div>
      <div class="sort-section-title">Direction</div>
      <div class="sort-dir">
        <div class="sort-dir-option ${draft.dir === 'asc' ? 'selected' : ''}" data-dir="asc">
          <span>↑</span><span>Ascending</span>
        </div>
        <div class="sort-dir-option ${draft.dir === 'desc' ? 'selected' : ''}" data-dir="desc">
          <span>↓</span><span>Descending</span>
        </div>
      </div>
    </div>
  `;

  openPopover(triggerEl, content, {
    onOpen: (pop) => {
      pop.querySelectorAll('.sort-option').forEach(opt => {
        opt.addEventListener('click', () => {
          draft.field = opt.dataset.field;
          pop.querySelectorAll('.sort-option').forEach(o => o.classList.toggle('selected', o.dataset.field === draft.field));
          // Apply immediately for instant feedback
          state.sort = { ...draft };
          refreshFollowupsTable();
          wireFollowupRowHandlers();
        });
      });
      pop.querySelectorAll('.sort-dir-option').forEach(opt => {
        opt.addEventListener('click', () => {
          draft.dir = opt.dataset.dir;
          pop.querySelectorAll('.sort-dir-option').forEach(o => o.classList.toggle('selected', o.dataset.dir === draft.dir));
          state.sort = { ...draft };
          refreshFollowupsTable();
          wireFollowupRowHandlers();
        });
      });
    }
  });
}

function afterFollowupsRender() {
  // Search input (still its own input outside the popover)
  const searchEl = document.getElementById('f_search');
  if (searchEl) {
    searchEl.addEventListener('input', () => {
      state.filters.search = searchEl.value;
      refreshFollowupsTable();
    });
  }

  // Filter button → opens filter popover
  const filterBtn = document.getElementById('followupFilterBtn');
  if (filterBtn) {
    filterBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openFollowupFilterPopover(filterBtn);
    });
  }

  // Sort button → opens sort popover
  const sortBtn = document.getElementById('followupSortBtn');
  if (sortBtn) {
    sortBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openFollowupSortPopover(sortBtn);
    });
  }

  // Sort headers in the table header (still clickable)
  document.querySelectorAll('.item-list-header .sortable').forEach(el => {
    el.addEventListener('click', () => {
      const f = el.dataset.sort;
      if (state.sort.field === f) {
        state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sort.field = f;
        state.sort.dir = 'asc';
      }
      refreshFollowupsTable();
      wireFollowupRowHandlers();
    });
  });

  wireFollowupRowHandlers();
}

/* Attach event handlers to follow-up table rows.
   Idempotent: removes previous handler before adding, so re-wiring is safe. */
function wireFollowupRowHandlers() {
  const tbody = document.getElementById('followupsTbody');
  if (!tbody) return;
  tbody.removeEventListener('click', handleFollowupRowClick);
  tbody.addEventListener('click', handleFollowupRowClick);
}

// Single delegated click handler. Just opens the edit panel for the clicked row.
function handleFollowupRowClick(e) {
  const row = e.target.closest('.item-row');
  if (row && row.dataset.id) {
    openFollowupModal(row.dataset.id);
  }
}

function openFollowupModal(id) {
  const editing = !!id;
  const item = editing
    ? state.followups.find(i => i.id === id)
    : {
        id: '', dateAdded: todayISO(), project: '', category: '', title: '', details: '',
        location: '', requiredAction: '', assignBy: '', assignee: '',
        status: 'Not Started', followUpDate: '', dueDate: '', latestUpdate: '', remark: ''
      };
  if (editing && !item) { showToast('Item not found', 'error'); return; }

  const opts = (arr, val) => arr.map(v => `<option value="${escapeHtml(v)}" ${v===val?'selected':''}>${escapeHtml(v)}</option>`).join('');

  // Rich header: eyebrow + item title + status badge
  const headerTitle = editing
    ? (item.title ? escapeHtml(item.title) : '<span class="panel-heading-empty">(Untitled item)</span>')
    : 'New Follow-up Item';
  const headerBadge = editing
    ? `${statusBadge(item.status)}`
    : '';
  const headerOverdue = editing && isOverdue(item)
    ? `<span class="badge badge-overdue"><i data-lucide="alert-triangle" class="icon-xs"></i>Overdue</span>`
    : (editing && isDueSoon(item) ? `<span class="badge badge-duesoon"><i data-lucide="clock" class="icon-xs"></i>Due Soon</span>` : '');

  const richHeader = `
    <div class="panel-eyebrow">${editing ? 'Follow-up Item' : 'Create new'}</div>
    <h3 class="panel-heading">${headerTitle}</h3>
    <div class="panel-meta">${headerBadge}${headerOverdue}</div>
  `;

  // Document-style field helper
  const field = (id, label, inputHTML, isRequired, isPrimary) => `
    <label class="panel-field${isPrimary ? ' panel-field-primary' : ''}" for="fld_${id}">
      <span class="panel-field-label">${label}${isRequired ? ' <span class="required">*</span>' : ''}</span>
      ${inputHTML}
    </label>
  `;

  const body = `
    <!-- Section 1: Title (primary, no section title) -->
    <div class="form-section">
      ${field('title', 'Title', `<input type="text" class="panel-input" id="fld_title" value="${escapeHtml(item.title)}" placeholder="Short description of the item" required>`, true, true)}
      ${field('details', 'Details', `<textarea class="panel-textarea" id="fld_details" placeholder="Add more context...">${escapeHtml(item.details)}</textarea>`)}
    </div>

    <!-- Section 2: Status & schedule -->
    <div class="form-section">
      <h4 class="form-section-title"><i data-lucide="clock" class="icon-sm"></i>Status & Schedule</h4>
      <div class="form-row cols-3">
        ${field('status', 'Status', `<select class="panel-select" id="fld_status" required>${opts(state.settings.statuses, item.status)}</select>`, true)}
        ${field('followUpDate', 'Follow-up Date', `<input type="date" class="panel-input" id="fld_followUpDate" value="${escapeHtml(item.followUpDate)}">`)}
        ${field('dueDate', 'Due Date', `<input type="date" class="panel-input" id="fld_dueDate" value="${escapeHtml(item.dueDate)}">`)}
      </div>
    </div>

    <!-- Section 3: Classification -->
    <div class="form-section">
      <h4 class="form-section-title"><i data-lucide="tag" class="icon-sm"></i>Classification</h4>
      <div class="form-row cols-2">
        ${field('project', 'Project / Zone', `<select class="panel-select" id="fld_project" required><option value="">— Select —</option>${opts(state.settings.projects, item.project)}</select>`, true)}
        ${field('category', 'Category', `<select class="panel-select" id="fld_category" required><option value="">— Select —</option>${opts(state.settings.categories, item.category)}</select>`, true)}
      </div>
      ${field('location', 'Location / Area', `<input type="text" class="panel-input" id="fld_location" value="${escapeHtml(item.location)}" placeholder="Specific area or room">`)}
      ${field('requiredAction', 'Required Action', `<input type="text" class="panel-input" id="fld_requiredAction" value="${escapeHtml(item.requiredAction)}" placeholder="What needs to be done">`)}
    </div>

    <!-- Section 4: Ownership -->
    <div class="form-section">
      <h4 class="form-section-title"><i data-lucide="users" class="icon-sm"></i>Ownership</h4>
      <div class="form-row cols-2">
        ${field('assignBy', 'Assign By', `<select class="panel-select" id="fld_assignBy"><option value="">— Select —</option>${opts(state.settings.assignBys, item.assignBy)}</select>`)}
        ${field('assignee', 'Assignee', `<select class="panel-select" id="fld_assignee"><option value="">— Select —</option>${opts(state.settings.assignees, item.assignee)}</select>`)}
      </div>
    </div>

    <!-- Section 5: Update -->
    <div class="form-section">
      <h4 class="form-section-title"><i data-lucide="message-square-text" class="icon-sm"></i>Latest Update</h4>
      ${field('latestUpdate', 'Update Note', `<textarea class="panel-textarea" id="fld_latestUpdate" placeholder="Current status, blockers, next step...">${escapeHtml(item.latestUpdate)}</textarea>`)}
      ${field('remark', 'Remark', `<textarea class="panel-textarea" id="fld_remark" placeholder="Internal notes...">${escapeHtml(item.remark)}</textarea>`)}

      <h4 class="form-section-title"><i data-lucide="file-text" class="icon-sm"></i>Record</h4>

  const footerButtons = [];
  if (editing) {
    footerButtons.push({ label: 'Delete', cls: 'btn-danger', icon: 'trash-2', onClick: () => { closeModal(); deleteFollowup(id); } });
    if (item.status !== 'Completed') {
      footerButtons.push({ label: 'Mark Completed', cls: 'btn-success', icon: 'circle-check-big', onClick: () => { closeModal(); markCompleted(id); } });
    }
  }
  footerButtons.push({ label: 'Cancel', cls: 'btn-secondary', onClick: closeModal });
  footerButtons.push({ label: editing ? 'Save Changes' : 'Add Item', cls: 'btn-primary', icon: editing ? 'check' : 'plus', onClick: () => saveFollowupForm(id) });

  openModal(richHeader, body, footerButtons, { panel: true, titleHTML: true });

async function saveFollowupForm(id) {
  const val = (k) => (document.getElementById('fld_' + k) || {}).value || '';
  const newItem = {
    id: id || uid(),
    dateAdded: val('dateAdded') || todayISO(),
    project: val('project'),
    category: val('category'),
    title: val('title').trim(),
    details: val('details').trim(),
    location: val('location').trim(),
    requiredAction: val('requiredAction').trim(),
    assignBy: val('assignBy'),
    assignee: val('assignee'),
    status: val('status'),
    followUpDate: val('followUpDate'),
    dueDate: val('dueDate'),
    latestUpdate: val('latestUpdate').trim(),
    remark: val('remark').trim()
  };

  if (!newItem.title) { showToast('Title is required', 'error'); return; }
  if (!newItem.project) { showToast('Project / Zone is required', 'error'); return; }
  if (!newItem.category) { showToast('Category is required', 'error'); return; }
  if (!newItem.status) { showToast('Status is required', 'error'); return; }

  if (id) {
    const idx = state.followups.findIndex(i => i.id === id);
    if (idx >= 0) state.followups[idx] = newItem;
  } else {
    state.followups.push(newItem);
  }
  saveFollowups();

  // Cloud sync (if enabled)
  if (CLOUD_MODE && currentUser && !window.__force_local__) {
    try {
      await saveFollowupCloud(newItem);
      showToast(id ? 'Item updated' : 'Item added', 'success');
    } catch (e) {
      // Error already shown by saveFollowupCloud
    }
  } else {
    showToast(id ? 'Item updated' : 'Item added', 'success');
  }

  closeModal();
  render();
}

function viewFollowup(id) {
  const item = state.followups.find(i => i.id === id);
  if (!item) return;
  const row = (label, value) => `
    <div class="detail-row">
      <div class="detail-row-label">${label}</div>
      <div class="detail-row-value">${value || '—'}</div>
    </div>`;
  const body = `
    ${row('Date Added', formatDate(item.dateAdded))}
    ${row('Project / Zone', escapeHtml(item.project))}
    ${row('Category', escapeHtml(item.category))}
    ${row('Title', '<strong>' + escapeHtml(item.title) + '</strong>')}
    ${row('Details', escapeHtml(item.details))}
    ${row('Location / Area', escapeHtml(item.location))}
    ${row('Required Action', escapeHtml(item.requiredAction))}
    ${row('Assign By', escapeHtml(item.assignBy))}
    ${row('Assignee', escapeHtml(item.assignee))}
    ${row('Status', statusBadge(item.status))}
    ${row('Follow-up Date', formatDate(item.followUpDate))}
    ${row('Due Date', formatDate(item.dueDate) + (isOverdue(item) ? ' <span class="cell-danger">(Overdue)</span>' : ''))}
    ${row('Latest Update', escapeHtml(item.latestUpdate))}
    ${row('Remark', escapeHtml(item.remark))}
  `;
  openInfoModal('Follow-up Item Details', body);
}

async function markCompleted(id) {
  const item = state.followups.find(i => i.id === id);
  if (!item) return;
  if (!confirm('Mark this item as Completed?')) return;
  item.status = 'Completed';
  saveFollowups();
  if (CLOUD_MODE && currentUser && !window.__force_local__) {
    try { await saveFollowupCloud(item); } catch (e) {}
  }
  showToast('Marked as completed', 'success');
  render();
}

async function deleteFollowup(id) {
  if (!confirm('Delete this follow-up item? This cannot be undone.')) return;
  state.followups = state.followups.filter(i => i.id !== id);
  saveFollowups();
  if (CLOUD_MODE && currentUser && !window.__force_local__) {
    try { await deleteFollowupCloud(id); } catch (e) {}
  }
  showToast('Item deleted', 'success');
  render();
}

      </div>

        <i data-lucide="sliders-horizontal" class="icon-md"></i>

        ${countActiveMeetingFilters() > 0 ? `<span class="toolbar-btn-count">${countActiveMeetingFilters()}</span>` : ''}

      </button>
      <button class="toolbar-btn" id="meetingSortBtn">
        <i data-lucide="arrow-up-down" class="icon-md"></i>

        <i data-lucide="chevron-down" class="icon-sm toolbar-btn-caret"></i>
      </button>

        <span>Export</span>
      </button>
    </div>

    <div class="meeting-list">
      <div class="meeting-list-header">
        <div></div>
        <div>Date</div>
        <div>Decision &amp; Discussion</div>
        <div>Action Owner</div>
        <div>Follow-up</div>
      </div>
      <div id="meetingsTbody">
        ${renderMeetingRows()}
      </div>
    </div>
  `;
}

function countActiveMeetingFilters() {
  const f = state.meetingFilters;
  let n = 0;
  if (f.dateFrom) n++;
  if (f.dateTo) n++;
  n += f.actionOwner.length;
  return n;
}

function renderMeetingActiveChips() {
  const f = state.meetingFilters;
  const chips = [];
  if (f.dateFrom) chips.push(buildMeetingChip('From', formatDate(f.dateFrom), 'dateFrom'));
  if (f.dateTo)   chips.push(buildMeetingChip('To',   formatDate(f.dateTo),   'dateTo'));
  f.actionOwner.forEach((v, i) => chips.push(buildMeetingArrayChip('Owner', v, 'actionOwner', i)));
  if (!chips.length) return '';
  return chips.join('') + `<button class="toolbar-clear-all" onclick="clearAllMeetingFilters()">Clear all</button>`;
}

function buildMeetingChip(keyLabel, value, fieldName) {
  return `
    <span class="filter-chip">
      <span class="filter-chip-key">${escapeHtml(keyLabel)}</span>
      <span>${escapeHtml(value)}</span>
      <button class="filter-chip-remove" onclick="removeMeetingFilter('${fieldName}')" title="Remove"><i data-lucide="x" class="icon-sm"></i></button>
    </span>
  `;
}

function buildMeetingArrayChip(keyLabel, value, fieldName, index) {
  return `
    <span class="filter-chip">
      <span class="filter-chip-key">${escapeHtml(keyLabel)}</span>
      <span>${escapeHtml(value)}</span>
      <button class="filter-chip-remove" onclick="removeMeetingArrayFilter('${fieldName}', ${index})" title="Remove"><i data-lucide="x" class="icon-sm"></i></button>
    </span>
  `;
}

function removeMeetingFilter(field) {
  state.meetingFilters[field] = '';
  refreshMeetingsTable();
  refreshMeetingToolbar();
}

function removeMeetingArrayFilter(field, index) {
  state.meetingFilters[field].splice(index, 1);
  refreshMeetingsTable();
  refreshMeetingToolbar();
}

function clearAllMeetingFilters() {
  state.meetingFilters = { search: state.meetingFilters.search, dateFrom:'', dateTo:'', actionOwner: [] };
  refreshMeetingsTable();
  refreshMeetingToolbar();
}

function refreshMeetingToolbar() {
  const chips = document.getElementById('meetingChips');
  if (chips) chips.innerHTML = renderMeetingActiveChips();
  const filterBtn = document.getElementById('meetingFilterBtn');
  if (filterBtn) {
    const count = countActiveMeetingFilters();
    filterBtn.classList.toggle('active', count > 0);
    filterBtn.innerHTML = `
      <i data-lucide="sliders-horizontal" class="icon-md"></i>
      <span>Filters</span>
      ${count > 0 ? `<span class="toolbar-btn-count">${count}</span>` : ''}
      <i data-lucide="chevron-down" class="icon-sm toolbar-btn-caret"></i>
    `;
  }
  renderIcons();
}

/* Collect unique action owners from existing meetings for filter chips */
function getMeetingActionOwners() {
  const set = new Set();
  state.meetings.forEach(m => { if (m.actionOwner) set.add(m.actionOwner); });
  return Array.from(set).sort();
}

          const value = chip.dataset.value;
          const arr = draft[field];
          const idx = arr.indexOf(value);
          if (idx >= 0) arr.splice(idx, 1);
          else arr.push(value);
          chip.classList.toggle('selected', arr.includes(value));
        });
      });

      pop.querySelector('#applyMeetingFilters').addEventListener('click', () => {
        draft.dateFrom = pop.querySelector('#mPopDateFrom').value;
        draft.dateTo   = pop.querySelector('#mPopDateTo').value;
        state.meetingFilters = draft;
        refreshMeetingsTable();
        refreshMeetingToolbar();
        closePopover();
      });

      window.resetDraftMeetingFilters = () => {
        draft.dateFrom = '';
        draft.dateTo = '';
        draft.actionOwner.length = 0;
        pop.querySelectorAll('.chip-option').forEach(c => c.classList.remove('selected'));
        pop.querySelector('#mPopDateFrom').value = '';
        pop.querySelector('#mPopDateTo').value = '';
      };
    }
  });
}

/* ================================================================
   MEETING SORT POPOVER
   ================================================================ */
const MEETING_SORT_FIELDS = [
  { value: 'meetingDate',  label: 'Meeting Date' },
  { value: 'followUpDate', label: 'Follow-up Date' },
  { value: 'actionOwner',  label: 'Action Owner' }
];

function openMeetingSortPopover(triggerEl) {
  const draft = { ...state.meetingSort };
  const content = `
    <div class="popover-sort">
      <div class="sort-section-title">Sort by</div>
      ${MEETING_SORT_FIELDS.map(f => `
        <div class="sort-option ${draft.field === f.value ? 'selected' : ''}" data-field="${f.value}">
          <span class="sort-option-radio"></span>
          <span>${f.label}</span>
        </div>
      `).join('')}
      <div class="sort-divider"></div>
      <div class="sort-section-title">Direction</div>
      <div class="sort-dir">
        <div class="sort-dir-option ${draft.dir === 'asc' ? 'selected' : ''}" data-dir="asc">
          <span>↑</span><span>Ascending</span>
        </div>
        <div class="sort-dir-option ${draft.dir === 'desc' ? 'selected' : ''}" data-dir="desc">
          <span>↓</span><span>Descending</span>
        </div>
      </div>
    </div>
  `;
  openPopover(triggerEl, content, {
    onOpen: (pop) => {
      pop.querySelectorAll('.sort-option').forEach(opt => {
        opt.addEventListener('click', () => {
          draft.field = opt.dataset.field;
          pop.querySelectorAll('.sort-option').forEach(o => o.classList.toggle('selected', o.dataset.field === draft.field));
          state.meetingSort = { ...draft };
          refreshMeetingsTable();
        });
      });
      pop.querySelectorAll('.sort-dir-option').forEach(opt => {
        opt.addEventListener('click', () => {
          draft.dir = opt.dataset.dir;
          pop.querySelectorAll('.sort-dir-option').forEach(o => o.classList.toggle('selected', o.dataset.dir === draft.dir));
          state.meetingSort = { ...draft };
          refreshMeetingsTable();
        });
      });
    }
  });
}

function getFilteredMeetings() {
  let items = state.meetings.slice();
  const f = state.meetingFilters;
  if (f.search) {
    const q = f.search.toLowerCase();
    items = items.filter(m =>
      (m.attendees || '').toLowerCase().includes(q) ||
      (m.discussionPoint || '').toLowerCase().includes(q) ||
      (m.decision || '').toLowerCase().includes(q) ||
      (m.actionOwner || '').toLowerCase().includes(q) ||
      (m.remark || '').toLowerCase().includes(q)
    );
  }
  if (f.dateFrom)           items = items.filter(m => m.meetingDate && m.meetingDate >= f.dateFrom);
  if (f.dateTo)             items = items.filter(m => m.meetingDate && m.meetingDate <= f.dateTo);
  if (f.actionOwner.length) items = items.filter(m => f.actionOwner.includes(m.actionOwner || ''));

  // Sort
  const { field, dir } = state.meetingSort;
  items.sort((a,b) => {
    const av = (a[field] || '').toString();
    const bv = (b[field] || '').toString();
    if (!av && !bv) return 0;
    if (!av) return 1;
    if (!bv) return -1;
    if (av === bv) return 0;
    const cmp = av < bv ? -1 : 1;
    return dir === 'asc' ? cmp : -cmp;
  });
  return items;
}

function renderMeetingRows() {
  const items = getFilteredMeetings();
  if (!items.length) {
    return `<div class="empty-state">No meeting notes match your filters.</div>`;
  }
  const truncate = (s, n) => { s = s || ''; return s.length > n ? s.slice(0, n) + '…' : s; };
  const monthShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  return items.map(m => {
    // Build calendar tear-off from meeting date
    let dateBlock;
    if (m.meetingDate) {
      const d = new Date(m.meetingDate + 'T00:00:00');
      if (!isNaN(d)) {
        dateBlock = `
          <div class="meeting-date-pill">
            <div class="meeting-date-day">${d.getDate()}</div>
            <div class="meeting-date-month">${monthShort[d.getMonth()]}</div>
            <div class="meeting-date-year">${d.getFullYear()}</div>
          </div>
        `;
      } else {
        dateBlock = `<div class="meeting-date-pill"><div class="meeting-date-month">No date</div></div>`;
      }
    } else {
      dateBlock = `<div class="meeting-date-pill"><div class="meeting-date-month">No date</div></div>`;
    }

    // Determine follow-up state for accent border + pill
    let rowCls = 'meeting-row';
    let followupBlock;
    if (m.followUpDate) {
      const days = daysBetween(m.followUpDate);
      let pillCls, pillText;
      if (days < 0) {
        pillCls = 'past'; pillText = formatDate(m.followUpDate);
      } else if (days === 0) {
        pillCls = 'today'; pillText = 'Today';
        rowCls += ' has-overdue-followup';
      } else if (days <= 14) {
        pillCls = 'upcoming'; pillText = days <= 7 ? `In ${days}d` : formatDate(m.followUpDate);
        rowCls += ' has-upcoming';
      } else {
        pillCls = 'upcoming'; pillText = formatDate(m.followUpDate);
        rowCls += ' has-upcoming';
      }
      followupBlock = `
        <div class="meeting-followup">
          <div class="meeting-followup-label">Follow-up</div>
          <span class="meeting-followup-pill ${pillCls}">${escapeHtml(pillText)}</span>
        </div>
      `;
    } else {
      followupBlock = `
        <div class="meeting-followup">
          <div class="meeting-followup-label">Follow-up</div>
          <span class="meeting-followup-empty">—</span>
        </div>
      `;
    }

    // Decision (primary text). If empty, show discussion as fallback.
    const decisionHTML = m.decision
      ? `<div class="meeting-decision"><span class="meeting-decision-label">Decision</span>${escapeHtml(m.decision)}</div>`
      : (m.discussionPoint
          ? `<div class="meeting-decision meeting-decision-empty">No decision recorded</div>`
          : `<div class="meeting-decision meeting-decision-empty">No content</div>`
        );

    // Discussion as secondary line (only if both decision AND discussion exist)
    const discussionHTML = (m.decision && m.discussionPoint)
      ? `<div class="meeting-discussion"><span class="meeting-discussion-label">Topic</span>${escapeHtml(truncate(m.discussionPoint, 120))}</div>`
      : (!m.decision && m.discussionPoint
          ? `<div class="meeting-discussion"><span class="meeting-discussion-label">Topic</span>${escapeHtml(truncate(m.discussionPoint, 120))}</div>`
          : '');

    // Attendees line
    const attendeesHTML = m.attendees
      ? `<div class="meeting-attendees"><i data-lucide="users" class="icon-sm meeting-attendees-icon"></i><span class="meeting-attendees-text">${escapeHtml(m.attendees)}</span></div>`
      : '';

    return `
      <div class="${rowCls}" data-id="${m.id}">
        <div class="meeting-accent"></div>
        ${dateBlock}
        <div class="meeting-content">
          ${decisionHTML}
          ${discussionHTML}
          ${attendeesHTML}
        </div>
        <div class="meeting-owner">
          <div class="meeting-owner-label">Action Owner</div>
          <div class="meeting-owner-name${m.actionOwner ? '' : ' meeting-owner-empty'}">${escapeHtml(m.actionOwner || 'Not assigned')}</div>
        </div>
        ${followupBlock}
      </div>
    `;
  }).join('');
}

function openMeetingModal(id) {
  const editing = !!id;

    : { id:'', meetingDate: todayISO(), attendees:'', discussionPoint:'', decision:'', actionOwner:'', followUpDate:'', remark:'' };

  // Rich header: eyebrow + meeting date as the heading + meta line
  const headerHeading = editing
    ? (m.meetingDate ? escapeHtml(formatDate(m.meetingDate)) : '<span class="panel-heading-empty">(No date)</span>')
    : 'New Meeting Note';
  const metaParts = [];
  if (editing && m.actionOwner) metaParts.push(`<span class="text-secondary">Owner: <strong>${escapeHtml(m.actionOwner)}</strong></span>`);
  if (editing && m.followUpDate) metaParts.push(`<span class="text-muted">Follow-up: ${escapeHtml(formatDate(m.followUpDate))}</span>`);
  const headerMeta = metaParts.length ? `<div class="panel-meta">${metaParts.join(' · ')}</div>` : '';

  const richHeader = `
    <div class="panel-eyebrow">${editing ? 'Meeting Note' : 'Create new'}</div>
    <h3 class="panel-heading">${headerHeading}</h3>
    ${headerMeta}
  `;

  // Document-style field helper (mirrors openFollowupModal)
  const field = (fldId, label, inputHTML, isRequired, isPrimary) => `
    <label class="panel-field${isPrimary ? ' panel-field-primary' : ''}" for="mfld_${fldId}">
      <span class="panel-field-label">${label}${isRequired ? ' <span class="required">*</span>' : ''}</span>
      ${inputHTML}
    </label>
  `;

  const body = `
    <!-- Section 1: Discussion & Decision (the primary content of a meeting note) -->
    <div class="form-section">
      ${field('discussionPoint', 'Discussion Point', `<textarea class="panel-textarea" id="mfld_discussionPoint" placeholder="What was discussed?">${escapeHtml(m.discussionPoint)}</textarea>`)}
      ${field('decision', 'Decision', `<textarea class="panel-textarea" id="mfld_decision" placeholder="What was decided?">${escapeHtml(m.decision)}</textarea>`)}
    </div>

    <!-- Section 2: Participants -->
    <div class="form-section">
      <h4 class="form-section-title"><i data-lucide="users" class="icon-sm"></i>Participants</h4>
      ${field('attendees', 'Attendees', `<input type="text" class="panel-input" id="mfld_attendees" value="${escapeHtml(m.attendees)}" placeholder="e.g. PM, GM, Main Contractor, Consultant">`)}
      ${field('actionOwner', 'Action Owner', `<input type="text" class="panel-input" id="mfld_actionOwner" value="${escapeHtml(m.actionOwner)}" placeholder="Who is responsible for follow-through">`)}
    </div>

    <!-- Section 3: Schedule -->
    <div class="form-section">
      <h4 class="form-section-title"><i data-lucide="calendar" class="icon-sm"></i>Schedule</h4>
      <div class="form-row cols-2">
        ${field('meetingDate', 'Meeting Date', `<input type="date" class="panel-input" id="mfld_meetingDate" value="${escapeHtml(m.meetingDate)}" required>`, true)}
        ${field('followUpDate', 'Follow-up Date', `<input type="date" class="panel-input" id="mfld_followUpDate" value="${escapeHtml(m.followUpDate)}">`)}
      </div>
    </div>

    <!-- Section 4: Note (de-emphasized) -->
    <div class="form-section form-section-meta">
      <h4 class="form-section-title"><i data-lucide="sticky-note" class="icon-sm"></i>Remark</h4>
      ${field('remark', 'Internal Note', `<input type="text" class="panel-input" id="mfld_remark" value="${escapeHtml(m.remark)}" placeholder="Optional internal note">`)}
    </div>
  `;

  // Build footer buttons. For existing meetings, include a Delete button.
  const footerButtons = [];
  if (editing) {
    footerButtons.push({ label: 'Delete', cls: 'btn-danger', icon: 'trash-2', onClick: () => { closeModal(); deleteMeeting(id); } });
  }
  footerButtons.push({ label: 'Cancel', cls: 'btn-secondary', onClick: closeModal });
  footerButtons.push({ label: editing ? 'Save Changes' : 'Add Meeting Note', cls: 'btn-primary', icon: editing ? 'check' : 'plus', onClick: () => saveMeetingForm(id) });

  openModal(richHeader, body, footerButtons, { panel: true, titleHTML: true });
}

async function saveMeetingForm(id) {
  const val = (k) => (document.getElementById('mfld_' + k) || {}).value || '';
  const newM = {
    id: id || uid(),
    meetingDate: val('meetingDate') || todayISO(),
    attendees: val('attendees').trim(),
    discussionPoint: val('discussionPoint').trim(),
    decision: val('decision').trim(),
    actionOwner: val('actionOwner').trim(),
    followUpDate: val('followUpDate'),
    remark: val('remark').trim()
  };
  if (!newM.meetingDate) { showToast('Meeting date is required', 'error'); return; }

  if (id) {
    const idx = state.meetings.findIndex(x => x.id === id);
    if (idx >= 0) state.meetings[idx] = newM;
  } else {
    state.meetings.push(newM);
  }
  saveMeetings();

  if (CLOUD_MODE && currentUser && !window.__force_local__) {
    try {
      await saveMeetingCloud(newM);
      showToast(id ? 'Meeting note updated' : 'Meeting note added', 'success');
    } catch (e) {}
  } else {
    showToast(id ? 'Meeting note updated' : 'Meeting note added', 'success');
  }

  closeModal();
  render();
}

function viewMeeting(id) {
  const m = state.meetings.find(x => x.id === id);
  if (!m) return;
  const row = (label, value) => `
    <div class="detail-row">
      <div class="detail-row-label">${label}</div>
      <div class="detail-row-value">${value || '—'}</div>
    </div>`;
  const body = `
    ${row('Meeting Date', formatDate(m.meetingDate))}
    ${row('Attendees', escapeHtml(m.attendees))}
    ${row('Discussion Point', escapeHtml(m.discussionPoint))}
    ${row('Decision', escapeHtml(m.decision))}
    ${row('Action Owner', escapeHtml(m.actionOwner))}
    ${row('Follow-up Date', formatDate(m.followUpDate))}
    ${row('Remark', escapeHtml(m.remark))}
  `;
  openInfoModal('Meeting Note Details', body);
}

async function deleteMeeting(id) {
  if (!confirm('Delete this meeting note? This cannot be undone.')) return;
  state.meetings = state.meetings.filter(m => m.id !== id);
  saveMeetings();
  if (CLOUD_MODE && currentUser && !window.__force_local__) {
    try { await deleteMeetingCloud(id); } catch (e) {}
  }
  showToast('Meeting note deleted', 'success');
  render();
}

function renderSettingsListItems(key) {

function afterSettingsRender() {
  SETTING_GROUPS.forEach(g => {
    const input = document.getElementById('settings_input_' + g.key);
    if (input) {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); addSettingValue(g.key); }
      });

  });

function addSettingValue(key) {
  const input = document.getElementById('settings_input_' + key);
  const v = input.value.trim();
  if (!v) { showToast('Please enter a value', 'error'); return; }
  if (state.settings[key].includes(v)) { showToast('Value already exists', 'error'); return; }
  state.settings[key].push(v);
  saveSettings();
  input.value = '';
  document.getElementById('settings_list_' + key).innerHTML = renderSettingsListItems(key); renderIcons();
  showToast('Added: ' + v, 'success');
}

function editSettingValue(key, index) {
  const current = state.settings[key][index];
  const newVal = prompt('Edit value:', current);
  if (newVal === null) return;
  const trimmed = newVal.trim();
  if (!trimmed) { showToast('Value cannot be empty', 'error'); return; }
  if (trimmed === current) return;
  if (state.settings[key].includes(trimmed)) { showToast('Value already exists', 'error'); return; }

  state.settings[key][index] = trimmed;
  saveSettings();
  document.getElementById('settings_list_' + key).innerHTML = renderSettingsListItems(key); renderIcons();
  showToast('Updated', 'success');
}

function deleteSettingValue(key, index) {
  const v = state.settings[key][index];
  if (!confirm(`Delete "${v}" from this list? Existing items using this value will keep it but the dropdown will no longer offer it.`)) return;
  state.settings[key].splice(index, 1);
  saveSettings();
  document.getElementById('settings_list_' + key).innerHTML = renderSettingsListItems(key); renderIcons();
  showToast('Deleted: ' + v, 'success');
}

function restoreDefaultSettings() {
  if (!confirm('Restore all dropdown lists to defaults? Your custom values in these lists will be lost.')) return;
  state.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  saveSettings();
  render();
  showToast('Default settings restored', 'success');
}

function getStorageSize() {
  let total = 0;
  Object.values(STORAGE_KEYS).forEach(k => {
    const v = localStorage.getItem(k);
    if (v) total += v.length;
  });
  if (total < 1024) return total + ' bytes';
  return (total / 1024).toFixed(1) + ' KB';
}

/* CSV utility */
function csvEscape(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportFollowupsCSV() {
  const headers = [
    'Date Added','Project / Zone','Category','Title','Details',
    'Location / Area','Required Action','Assign By','Assignee',
    'Status','Follow-up Date','Due Date','Latest Update','Remark'
  ];
  const rows = state.followups.map(i => [
    i.dateAdded, i.project, i.category, i.title, i.details,
    i.location, i.requiredAction, i.assignBy, i.assignee,
    i.status, i.followUpDate, i.dueDate, i.latestUpdate, i.remark
  ]);
  const csv = [headers, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
  // BOM for Excel UTF-8
  downloadFile(`followups_${todayISO()}.csv`, '\uFEFF' + csv, 'text/csv;charset=utf-8;');
  showToast('CSV exported', 'success');
}

function exportMeetingsCSV() {
  const headers = ['Meeting Date','Attendees','Discussion Point','Decision','Action Owner','Follow-up Date','Remark'];
  const rows = state.meetings.map(m => [
    m.meetingDate, m.attendees, m.discussionPoint, m.decision,
    m.actionOwner, m.followUpDate, m.remark
  ]);
  const csv = [headers, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
  downloadFile(`meetings_${todayISO()}.csv`, '\uFEFF' + csv, 'text/csv;charset=utf-8;');
  showToast('CSV exported', 'success');
}

function exportBackup() {
  const backup = {
    version: 1,
    exportedAt: new Date().toISOString(),
    followups: state.followups,
    meetings: state.meetings,
    settings: state.settings
  };
  downloadFile(`cfms_backup_${todayISO()}.json`, JSON.stringify(backup, null, 2), 'application/json');
  showToast('Backup exported', 'success');
}

function importBackup() {
  const input = document.getElementById('importFile');
  const file = input.files && input.files[0];
  if (!file) { showToast('Please select a JSON file first', 'error'); return; }
  if (!confirm('This will REPLACE all current data with the imported backup. Continue?')) return;

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || typeof data !== 'object') throw new Error('Invalid backup file');

      state.followups = Array.isArray(data.followups) ? data.followups : [];
      state.meetings  = Array.isArray(data.meetings)  ? data.meetings  : [];
      if (data.settings && typeof data.settings === 'object') {
        state.settings = { ...DEFAULT_SETTINGS, ...data.settings };
      }
      saveFollowups();
      saveMeetings();
      saveSettings();

      // Sync all imported items to cloud
      if (CLOUD_MODE && currentUser && !window.__force_local__) {
        showToast('Importing to cloud...', 'success');
        try {
          // Clear existing cloud data first
          await sb.from('followups').delete().neq('id', '');
          await sb.from('meetings').delete().neq('id', '');
          // Upsert all in batches
          for (const fu of state.followups) await saveFollowupCloud(fu);
          for (const m of state.meetings) await saveMeetingCloud(m);
          await saveSettingsCloud();
          showToast('Backup imported and synced', 'success');
        } catch (err) {
          showToast('Local import OK but cloud sync failed: ' + err.message, 'error');
        }
      } else {
        showToast('Backup imported successfully', 'success');
      }
      input.value = '';
      render();
    } catch (err) {
      console.error(err);
      showToast('Failed to import: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

async function resetAllData() {
  const phrase = 'RESET';
  const answer = prompt(`This will permanently delete all follow-up items and meeting notes. Type ${phrase} to confirm:`);
  if (answer !== phrase) { showToast('Reset cancelled', 'error'); return; }
  state.followups = [];
  state.meetings = [];
  saveFollowups();
  saveMeetings();
  if (CLOUD_MODE && currentUser && !window.__force_local__) {
    try {
      await sb.from('followups').delete().neq('id', '');
      await sb.from('meetings').delete().neq('id', '');
    } catch (e) { console.error(e); }
  }
  showToast('All data reset', 'success');
  render();
}

/* -----------------------------------------------------------------
   15. MODAL HELPERS
   ----------------------------------------------------------------- */
function openModal(title, bodyHTML, buttons, opts) {
  opts = opts || {};
  // Allow HTML in title for rich panel headers
  if (opts.titleHTML) {
    document.getElementById('modalTitle').innerHTML = title;
  } else {
    document.getElementById('modalTitle').textContent = title;
  }
  document.getElementById('modalBody').innerHTML = bodyHTML;
  const footer = document.getElementById('modalFooter');
  footer.innerHTML = '';
  (buttons || []).forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls || 'btn-secondary');
    if (b.icon) {
      btn.innerHTML = `<i data-lucide="${b.icon}" class="icon-md"></i><span>${escapeHtml(b.label)}</span>`;
    } else {
      btn.textContent = b.label;
    }
    btn.addEventListener('click', b.onClick);
    footer.appendChild(btn);
  });
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.toggle('panel-mode', !!opts.panel);
  overlay.classList.add('show');
  renderIcons();
}

function openInfoModal(title, bodyHTML) {
  openModal(title, bodyHTML, [{ label: 'Close', cls: 'btn-secondary', onClick: closeModal }]);
}

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('show');
  overlay.classList.remove('panel-mode');
}

/* -----------------------------------------------------------------
   16. INIT
   ----------------------------------------------------------------- */
function afterDashboardRender() { /* placeholder */ }

async function init() {
  // Nav clicks (wire up early since they don't need data)
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => navigate(btn.dataset.page));
  });

  // Modal close handlers
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // Mobile menu
  document.getElementById('mobileMenuBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarBackdrop').classList.toggle('show');
  });
  document.getElementById('sidebarBackdrop').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop').classList.remove('show');
  });

  if (CLOUD_MODE) {
    // Multi-user mode: gate everything behind sign-in.
    // App shell stays hidden until auth succeeds.
    try {
      const user = await initAuth();
      if (user) {
        // Already signed in — load cloud data, render, and reveal
        await loadData();
        subscribeRealtime();
        render();
        revealApp();
      } else {
        // Not signed in — show only the login screen
        // (Don't pre-render the app — keep it hidden until they sign in)
        showLoginScreen();
      }
    } catch (e) {
      console.error('[CFMS] Auth init failed:', e);
      // Even on failure, show the login screen (don't expose the app)
      showLoginScreen();
      // Display a clear error on the login card
      showAuthError('Could not connect to the server. Please refresh and try again. (' + (e.message || 'unknown error') + ')');
    }
  } else {
    // Single-user / local-only mode — no login required, reveal immediately
    loadDataLocal();
    render();
    revealApp();
  }
}

// Expose handlers needed via inline onclick
window.openFollowupModal = openFollowupModal;
window.navigate = navigate;
window.goToFiltered = goToFiltered;
window.removeFollowupFilter = removeFollowupFilter;
window.removeFollowupArrayFilter = removeFollowupArrayFilter;
window.clearAllFollowupFilters = clearAllFollowupFilters;
window.removeMeetingFilter = removeMeetingFilter;
window.removeMeetingArrayFilter = removeMeetingArrayFilter;
window.clearAllMeetingFilters = clearAllMeetingFilters;
window.viewFollowup = viewFollowup;
window.markCompleted = markCompleted;
window.deleteFollowup = deleteFollowup;
window.openMeetingModal = openMeetingModal;
window.viewMeeting = viewMeeting;
window.deleteMeeting = deleteMeeting;
window.changeCalendar = changeCalendar;
window.goToCurrentMonth = goToCurrentMonth;
window.showCalendarDay = showCalendarDay;
window.addSettingValue = addSettingValue;
window.editSettingValue = editSettingValue;
window.deleteSettingValue = deleteSettingValue;
window.restoreDefaultSettings = restoreDefaultSettings;
window.exportFollowupsCSV = exportFollowupsCSV;
window.exportMeetingsCSV = exportMeetingsCSV;
window.exportBackup = exportBackup;
window.importBackup = importBackup;
window.resetAllData = resetAllData;

// Start the app — wrapped in safety net so an unexpected init error
// still leaves the user on a sane state (login screen if cloud mode, or local app if single-user).
function safeInit() {
  try {
    init();
  } catch (e) {
    console.error('[CFMS] init() threw synchronously. Recovering...', e);
    try {
      if (CLOUD_MODE) {
        // Cloud mode: keep app hidden, show login screen with error
        showLoginScreen();
        showAuthError('Failed to start the app. Please refresh.');
      } else {
        // Local mode: render the app anyway
        loadDataLocal();
        render();
        revealApp();
      }
    } catch (e2) {
      console.error('Even local fallback failed:', e2);
    }
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', safeInit);
} else {
  safeInit();
}
